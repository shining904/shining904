<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        @font-face {
          font-family: "Song Myung";
          font-weight: 400;
          src: url("fonts/song-myung-latin-400-normal.woff2") format("woff2");
          unicode-range: U+0000-00FF, U+2190-21FF;
        }
        @font-face {
          font-family: "Song Myung";
          font-weight: 400;
          src: url("fonts/song-myung-korean-400-normal.woff2") format("woff2");
          unicode-range: U+1100-11FF, U+3130-318F, U+AC00-D7AF;
        }
        #elder-fade {
          position: absolute;
          inset: 0;
        }
        #elder-text {
          position: absolute;
          left: 90px;
          right: 90px;
          top: 270px;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
        }
        #elder-chip {
          padding: 12px 40px;
          border-radius: 999px;
          background: #5b2d6e;
          color: #ffffff;
          font-size: 40px;
          font-weight: 800;
          letter-spacing: 0.08em;
        }
        .elder-line {
          font-family: "Song Myung", serif;
          font-weight: 400;
          font-size: 92px;
          line-height: 1.25;
          color: #2b1d1a;
        }
        #elder-line1 {
          margin-top: 36px;
        }
        #elder-sub {
          margin-top: 24px;
          font-size: 44px;
          font-weight: 500;
          color: #6b5a50;
        }
        #elder-figure {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 300px;
          display: flex;
          justify-content: center;
        }
        #elder-img {
          display: block;
          height: 840px;
          width: auto;
        }
        #elder-line2 {
          color: #b8524a;
        }
      </style>
      <div id="root" data-composition-id="elder" data-width="1080" data-height="1920">
        <div id="elder-fade">
          <div id="elder-figure"><img id="elder-img" src="assets/elder.png" alt="장년기 서희" /></div>
          <div id="elder-text">
            <div id="elder-chip">장년기</div>
            <div id="elder-line1" class="elder-line">거란 대군 앞에서</div>
            <div id="elder-line2" class="elder-line">말 한마디로</div>
            <div id="elder-sub">싸우지 않고 강동 6주를 얻어낸 외교관 (993년)</div>
          </div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#elder-fade", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, 0);
        tl.fromTo("#elder-figure", { opacity: 0, y: 160 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.1);
        tl.fromTo("#elder-img", { scale: 1 }, { scale: 1.04, duration: 5.3, ease: "none", transformOrigin: "50% 100%" }, 0);
        tl.fromTo("#elder-chip", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.25);
        tl.fromTo(".elder-line", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.18 }, 0.4);
        tl.fromTo("#elder-sub", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1.2);
        tl.fromTo("#elder-line2", { scale: 1 }, { scale: 1.08, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }, 1.1);
        window.__timelines["elder"] = tl;
      </script>
    </template>
  </body>
</html>
