<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Black Han Sans";
          src: url("fonts/black-han-sans-latin-400-normal.woff2") format("woff2");
          unicode-range: U+0000-00FF, U+2190-21FF;
        }
        @font-face {
          font-family: "Black Han Sans";
          src: url("fonts/black-han-sans-korean-400-normal.woff2") format("woff2");
          unicode-range: U+1100-11FF, U+3130-318F, U+AC00-D7AF;
        }
        @font-face {
          font-family: "Noto Sans KR";
          font-weight: 800;
          src: url("fonts/noto-sans-kr-latin-800-normal.woff2") format("woff2");
          unicode-range: U+0000-00FF, U+2190-21FF;
        }
        @font-face {
          font-family: "Noto Sans KR";
          font-weight: 800;
          src: url("fonts/noto-sans-kr-korean-800-normal.woff2") format("woff2");
          unicode-range: U+1100-11FF, U+3130-318F, U+AC00-D7AF;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: linear-gradient(180deg, #f2fbf7 0%, #e0f2fb 100%);
          font-family: "Noto Sans KR", sans-serif;
          font-weight: 800;
        }
        #course-head {
          position: absolute;
          left: 0;
          right: 0;
          top: 170px;
          text-align: center;
          font-family: "Black Han Sans", sans-serif;
          font-size: 92px;
          color: #12357d;
        }
        #course-head em {
          font-style: normal;
          color: #3d8b12;
        }
        #course-period {
          position: absolute;
          left: 0;
          right: 0;
          top: 300px;
          text-align: center;
          font-size: 44px;
          color: #3c4a66;
        }
        #course-list {
          position: absolute;
          left: 70px;
          right: 70px;
          top: 400px;
          display: flex;
          flex-direction: column;
          gap: 16px;
        }
        .course-row {
          display: flex;
          align-items: center;
          height: 104px;
          padding: 0 26px;
          border-radius: 26px;
          background: #ffffff;
          box-shadow: 0 10px 26px rgba(18, 53, 125, 0.12);
        }
        .course-no {
          width: 120px;
          padding: 8px 0;
          border-radius: 16px;
          background: #3d8b12;
          color: #ffffff;
          text-align: center;
          font-size: 32px;
        }
        .course-date {
          width: 210px;
          margin-left: 22px;
          font-size: 36px;
          color: #12357d;
        }
        .course-txt {
          flex: 1;
          font-size: 38px;
          color: #2b3445;
        }
        #course-times {
          position: absolute;
          left: 70px;
          right: 70px;
          top: 1420px;
          display: flex;
          gap: 22px;
        }
        .course-time {
          flex: 1;
          padding: 24px 0;
          border-radius: 26px;
          background: #12357d;
          color: #ffffff;
          text-align: center;
          font-size: 42px;
        }
        .course-time b {
          display: block;
          font-family: "Black Han Sans", sans-serif;
          font-weight: 400;
          font-size: 58px;
          color: #5fe3c8;
        }
        #course-free {
          position: absolute;
          left: 50%;
          top: 1640px;
          width: 560px;
          margin-left: -280px;
          padding: 26px 0 30px;
          border-radius: 999px;
          background: #e6157e;
          color: #ffffff;
          text-align: center;
          font-family: "Black Han Sans", sans-serif;
          font-size: 92px;
          box-shadow: 0 18px 44px rgba(230, 21, 126, 0.45);
        }
      </style>
      <div id="root" data-composition-id="course" data-width="1080" data-height="1920">
        <div id="course-head"><em>8회</em> 완성 커리큘럼</div>
        <div id="course-period">10. 13.(화) ~ 11. 10.(화)</div>
        <div id="course-list">
          <div class="course-row"><div class="course-no">1회차</div><div class="course-date">10. 13.(화)</div><div class="course-txt">바이브코딩 이해하기</div></div>
          <div class="course-row"><div class="course-no">2회차</div><div class="course-date">10. 17.(토)</div><div class="course-txt">클로드 프로젝트 환경구성</div></div>
          <div class="course-row"><div class="course-no">3회차</div><div class="course-date">10. 20.(화)</div><div class="course-txt">개인 맞춤형 웹페이지 제작</div></div>
          <div class="course-row"><div class="course-no">4회차</div><div class="course-date">10. 24.(토)</div><div class="course-txt">웹 콘텐츠·인터랙션 통합 제작</div></div>
          <div class="course-row"><div class="course-no">5회차</div><div class="course-date">10. 27.(화)</div><div class="course-txt">AI 기반 점검 및 개선</div></div>
          <div class="course-row"><div class="course-no">6회차</div><div class="course-date">10. 31.(토)</div><div class="course-txt">상세페이지 제작 자동화</div></div>
          <div class="course-row"><div class="course-no">7회차</div><div class="course-date">11. 3.(화)</div><div class="course-txt">개인 프로젝트 기획</div></div>
          <div class="course-row"><div class="course-no">8회차</div><div class="course-date">11. 10.(화)</div><div class="course-txt">최종 결과물 완성 및 공유</div></div>
        </div>
        <div id="course-times">
          <div class="course-time" id="course-tue"><b>화요일</b>17:00 ~ 19:00</div>
          <div class="course-time" id="course-sat"><b>토요일</b>10:00 ~ 12:00</div>
        </div>
        <div id="course-free">교육비 무료</div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#course-head", { opacity: 0, y: -50 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.05);
        tl.fromTo("#course-period", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.3);
        tl.fromTo(".course-row", { opacity: 0, x: 140 }, { opacity: 1, x: 0, duration: 0.28, ease: "power3.out", stagger: 0.16 }, 0.35);
        tl.fromTo(".course-no", { scale: 0.4 }, { scale: 1, duration: 0.25, ease: "back.out(2.5)", stagger: 0.16 }, 0.45);
        tl.fromTo("#course-tue", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.8)" }, 1.75);
        tl.fromTo("#course-sat", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.8)" }, 2.6);
        tl.to(".course-row", { scale: 1.03, duration: 0.12, yoyo: true, repeat: 1, stagger: 0.08 }, 3.9);
        tl.fromTo("#course-free", { opacity: 0, scale: 2.6, rotation: -14 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.3, ease: "power4.out" }, 5.25);
        tl.to("#course-free", { scale: 1.07, duration: 0.25, yoyo: true, repeat: 5, ease: "sine.inOut" }, 5.6);
        window.__timelines["course"] = tl;
      </script>
    </template>
  </body>
</html>
