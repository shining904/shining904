      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(".chat-blob", { scale: 0.8 }, { scale: 1.15, duration: 4.25, ease: "none" }, 0);
        tl.fromTo("#chat-h1", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.05);
        tl.fromTo("#chat-win", { opacity: 0, y: 120, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "power3.out" }, 0.05);
        tl.fromTo("#chat-user", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(2)", transformOrigin: "right bottom" }, 0.3);
        tl.fromTo(".chat-ch", { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 0.03 }, 0.32);
        tl.fromTo("#chat-ai", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out" }, 1.0);
        tl.fromTo(".chat-line", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.15, stagger: 0.14 }, 1.35);
        tl.to("#chat-ai, #chat-code", { opacity: 0, duration: 0.15 }, 2.2);
        tl.fromTo("#chat-h2", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power4.out" }, 2.25);
        tl.fromTo("#chat-site", { opacity: 0, scale: 0.4, rotation: -6 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.4, ease: "back.out(1.6)" }, 2.25);
        tl.fromTo("#chat-stamp", { opacity: 0, scale: 2.4, rotation: -30 }, { opacity: 1, scale: 1, rotation: -12, duration: 0.25, ease: "power4.out" }, 2.85);
        tl.fromTo("#chat-robot", { opacity: 0, y: 200 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, 0.6);
        tl.to("#chat-robot", { y: -30, rotation: 6, duration: 0.6, yoyo: true, repeat: 4, ease: "sine.inOut" }, 1.0);
        window.__timelines["chat"] = tl;
