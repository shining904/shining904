<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>이천 쌀 군무 릴스</title>
    <script src="gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Noto Sans KR";
        font-weight: 500;
        src: url("fonts/noto-sans-kr-latin-500-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+2190-21FF;
      }
      @font-face {
        font-family: "Noto Sans KR";
        font-weight: 500;
        src: url("fonts/noto-sans-kr-korean-500-normal.woff2") format("woff2");
        unicode-range: U+1100-11FF, U+3130-318F, U+AC00-D7AF;
      }
      @font-face {
        font-family: "Noto Sans KR";
        font-weight: 800;
        src: url("fonts/noto-sans-kr-latin-800-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+2190-21FF;
      }
      @font-face {
        font-family: "Noto Sans KR";
        font-weight: 800;
        src: url("fonts/noto-sans-kr-korean-800-normal.woff2") format("woff2");
        unicode-range: U+1100-11FF, U+3130-318F, U+AC00-D7AF;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Noto Sans KR", sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- Clips: Magnific Seedance 2.5 (3D Babari rice-grain characters). Voices: ElevenLabs via Magnific. Music: Magnific ElevenLabs music, original track. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30.0"
      data-width="1080"
      data-height="1920"
    >
      <div id="clip1" data-composition-id="clip1" data-composition-src="compositions/clip1.html"
        data-start="0" data-duration="7.5" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div id="clip2" data-composition-id="clip2" data-composition-src="compositions/clip2.html"
        data-start="7.5" data-duration="7.5" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="clip3" data-composition-id="clip3" data-composition-src="compositions/clip3.html"
        data-start="15.0" data-duration="7.5" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html"
        data-start="22.5" data-duration="7.5" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="caps" data-composition-id="caps" data-composition-src="compositions/caps.html"
        data-start="0" data-duration="22.5" data-track-index="2" data-width="1080" data-height="1920"></div>
      <audio id="soundtrack" src="assets/audio/mix.mp3" data-start="0" data-duration="29.9" data-track-index="3"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
