<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        @font-face {
          font-family: "Black Han Sans";
          font-weight: 400;
          src: url("fonts/black-han-sans-latin-400-normal.woff2") format("woff2");
          unicode-range: U+0000-00FF, U+2190-21FF;
        }
        @font-face {
          font-family: "Black Han Sans";
          font-weight: 400;
          src: url("fonts/black-han-sans-korean-400-normal.woff2") format("woff2");
          unicode-range: U+1100-11FF, U+3130-318F, U+AC00-D7AF;
        }
        #end-bg {
          position: absolute;
          inset: -40px;
          width: calc(100% + 80px);
          height: calc(100% + 80px);
          object-fit: cover;
          filter: blur(18px) brightness(0.35);
        }
        #end-wrap {
          position: absolute;
          left: 70px;
          right: 70px;
          top: 300px;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          color: #ffffff;
        }
        #end-kicker {
          font-size: 46px;
          font-weight: 800;
          color: #f2c46b;
        }
        .end-title {
          font-family: "Black Han Sans", sans-serif;
          font-size: 118px;
          line-height: 1.1;
        }
        #end-title1 {
          margin-top: 18px;
        }
        #end-title2 {
          color: #f2c46b;
        }
        #end-date {
          margin-top: 44px;
          padding: 18px 44px;
          border-radius: 999px;
          background: #e0483a;
          font-family: "Black Han Sans", sans-serif;
          font-size: 70px;
        }
        #end-place {
          margin-top: 26px;
          font-size: 42px;
          font-weight: 800;
          line-height: 1.4;
        }
        #end-chips {
          margin-top: 40px;
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: 16px;
        }
        .end-chip {
          padding: 12px 28px;
          border-radius: 18px;
          background: rgba(242, 196, 107, 0.95);
          color: #1c1408;
          font-size: 40px;
          font-weight: 800;
        }
        #end-note {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 330px;
          text-align: center;
          font-size: 26px;
          font-weight: 500;
          color: rgba(255, 255, 255, 0.7);
        }
      </style>
      <div id="root" data-composition-id="end" data-width="1080" data-height="1920">
        <img id="end-bg" src="assets/end-frame.jpg" alt="" />
        <div id="end-wrap">
          <div id="end-kicker">갓 지은 햅쌀밥은 축제에서</div>
          <div id="end-title1" class="end-title">제25회 이천</div>
          <div id="end-title2" class="end-title">쌀문화축제</div>
          <div id="end-date">10.14(수) ~ 10.18(일)</div>
          <div id="end-place">이천 복하천 수변공원 일원</div>
          <div id="end-chips">
            <div class="end-chip">가마솥밥 이천명 이천원</div>
            <div class="end-chip">무지개 가래떡 뽑기</div>
            <div class="end-chip">돌아온 명인전</div>
            <div class="end-chip">이천첨단드론대전</div>
          </div>
        </div>
        <div id="end-note">※ 이 영상은 AI로 생성한 영상입니다</div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#end-bg", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, 0);
        tl.fromTo("#end-kicker", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.3 }, 0.1);
        tl.fromTo(".end-title", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power4.out", stagger: 0.46875 }, 0.46875);
        tl.fromTo("#end-date", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, 1.40625);
        tl.fromTo("#end-place", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.875);
        tl.fromTo(".end-chip", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.2, ease: "back.out(2)", stagger: 0.234375 }, 2.34375);
        tl.fromTo("#end-note", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 3.75);
        window.__timelines["end"] = tl;
      </script>
    </template>
  </body>
</html>
