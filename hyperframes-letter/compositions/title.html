<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Nanum Myeongjo";
          font-weight: 800;
          src: url("fonts/nanum-myeongjo-latin-800-normal.woff2") format("woff2");
          unicode-range: U+0000-00FF;
        }
        @font-face {
          font-family: "Nanum Myeongjo";
          font-weight: 800;
          src: url("fonts/nanum-myeongjo-korean-800-normal.woff2") format("woff2");
          unicode-range: U+1100-11FF, U+3130-318F, U+AC00-D7AF;
        }
        @font-face {
          font-family: "Noto Sans KR";
          font-weight: 500;
          src: url("fonts/noto-sans-kr-latin-500-normal.woff2") format("woff2");
          unicode-range: U+0000-00FF;
        }
        @font-face {
          font-family: "Noto Sans KR";
          font-weight: 500;
          src: url("fonts/noto-sans-kr-korean-500-normal.woff2") format("woff2");
          unicode-range: U+1100-11FF, U+3130-318F, U+AC00-D7AF;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: radial-gradient(ellipse at 50% 40%, #fff6e6 0%, #f3dfc0 55%, #d9b88e 100%);
        }
        #lt-glow {
          position: absolute;
          left: 50%;
          top: 40%;
          width: 1728px;
          height: 1728px;
          margin: -864px 0 0 -864px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(255, 255, 255, 0.85) 0%, rgba(255, 244, 220, 0) 60%);
        }
        .lt-dot {
          position: absolute;
          border-radius: 50%;
          background: rgba(255, 255, 255, 0.9);
          box-shadow: 0 0 14px 4px rgba(255, 236, 190, 0.8);
        }
        #lt-wrap {
          position: absolute;
          left: 0;
          right: 0;
          top: 50%;
          transform: translateY(-50%);
          text-align: center;
        }
        #lt-kicker {
          font-family: "Noto Sans KR", sans-serif;
          font-weight: 500;
          font-size: 38px;
          letter-spacing: 10px;
          color: #8a6a44;
        }
        #lt-line {
          width: 420px;
          height: 3px;
          margin: 34px auto;
          background: #b08a5a;
          transform-origin: center;
        }
        #lt-title {
          font-family: "Nanum Myeongjo", serif;
          font-weight: 800;
          font-size: 120px;
          line-height: 1.3;
          color: #4a3423;
        }
        #lt-sub {
          margin-top: 34px;
          font-family: "Noto Sans KR", sans-serif;
          font-weight: 500;
          font-size: 44px;
          color: #7a5b3c;
        }
      </style>

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#lt-glow", { scale: 0.7, opacity: 0.4 }, { scale: 1.1, opacity: 1, duration: 5, ease: "sine.out" }, 0);
        tl.fromTo(".lt-dot", { opacity: 0, y: 30 }, { opacity: 0.9, y: -60, duration: 5, ease: "none", stagger: 0.04 }, 0);
        tl.fromTo("#lt-kicker", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 0.3);
        tl.fromTo("#lt-line", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power2.inOut" }, 0.6);
        tl.fromTo("#lt-title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 1.2, ease: "power2.out" }, 0.9);
        tl.fromTo("#lt-sub", { opacity: 0 }, { opacity: 1, duration: 1.0 }, 1.8);
        tl.to("#lt-wrap", { opacity: 0, duration: 0.6, ease: "power1.in" }, 4.4);
        window.__timelines["title"] = tl;
