      <script>
        const tl = gsap.timeline({ paused: true });
        const legs = [0, 1, 2].map((i) => document.getElementById("map-leg" + i));
        const lens = legs.map((p) => p.getTotalLength());
        legs.forEach((p, i) => { p.style.strokeDasharray = "18 14"; });
        const car = document.getElementById("map-car");
        // reveal each leg with a mask-like dash: draw progress via dashoffset on a solid copy is heavy, so clip with stroke-dasharray on the dashed path
        function placeCar(i, u) {
          const pt = legs[i].getPointAtLength(lens[i] * u);
          car.style.left = pt.x + "px";
          car.style.top = pt.y + "px";
        }
        const legState = [0, 1, 2].map(() => ({ u: 0 }));
        function drawLeg(i) {
          const u = legState[i].u, L = lens[i];
          legs[i].style.strokeDasharray = u >= 1 ? "18 14" : `${L * u} ${L}`;
          if (u > 0) placeCar(i, u);
        }
        tl.to("#map-land", { attr: { "stroke-dashoffset": 0 }, duration: 1.4, ease: "power2.inOut" }, 0.1);
        tl.to("#map-river", { attr: { "stroke-dashoffset": 0 }, duration: 1.2, ease: "power2.out" }, 0.6);
        tl.fromTo("#map-mtn path, #map-trees circle", { scale: 0, transformOrigin: "50% 100%" }, { scale: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.012 }, 0.5);
        tl.fromTo("#map-title", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.15);
        tl.to("#map-title", { opacity: 0, y: -60, duration: 0.3 }, 1.794);
        tl.fromTo(".map-pin", { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.3, ease: "bounce.out", stagger: 0.12 }, 1.0);
        tl.to(".map-plabel", { opacity: 1, duration: 0.3 }, 13.079);
        tl.fromTo("#map-car", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, 1.994);
        tl.fromTo("#map-cam", { x: 0, y: 0, scale: 1 }, { x: -448.0, y: -396.0, scale: 1.9, duration: 0.9, ease: "power2.inOut" }, 1.694);
        tl.fromTo("#map-card0", { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.6)" }, 2.394);
        tl.to("#map-pin0", { scale: 1.5, duration: 0.25, yoyo: true, repeat: 1, transformOrigin: "50% 100%" }, 2.394);
        tl.to("#map-card0", { opacity: 0, y: 60, duration: 0.25 }, 4.601);
        tl.to(legState[0], { u: 1, duration: 1.0, ease: "power1.inOut", onUpdate: () => drawLeg(0) }, 4.851);
        tl.to("#map-cam", { x: -324.5, y: -899.5, scale: 1.9, duration: 1.0, ease: "power1.inOut" }, 4.851);
        tl.fromTo("#map-card1", { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.6)" }, 5.751);
        tl.to("#map-pin1", { scale: 1.5, duration: 0.25, yoyo: true, repeat: 1, transformOrigin: "50% 100%" }, 5.751);
        tl.to("#map-card1", { opacity: 0, y: 60, duration: 0.25 }, 6.887);
        tl.to(legState[1], { u: 1, duration: 1.0, ease: "power1.inOut", onUpdate: () => drawLeg(1) }, 7.137);
        tl.to("#map-cam", { x: -676.0, y: -1194.0, scale: 1.9, duration: 1.0, ease: "power1.inOut" }, 7.137);
        tl.fromTo("#map-card2", { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.6)" }, 8.037);
        tl.to("#map-pin2", { scale: 1.5, duration: 0.25, yoyo: true, repeat: 1, transformOrigin: "50% 100%" }, 8.037);
        tl.to("#map-card2", { opacity: 0, y: 60, duration: 0.25 }, 9.744);
        tl.to(legState[2], { u: 1, duration: 1.0, ease: "power1.inOut", onUpdate: () => drawLeg(2) }, 9.994);
        tl.to("#map-cam", { x: 65.0, y: -1555.0, scale: 1.9, duration: 1.0, ease: "power1.inOut" }, 9.994);
        tl.fromTo("#map-card3", { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.6)" }, 10.894);
        tl.to("#map-pin3", { scale: 1.5, duration: 0.25, yoyo: true, repeat: 1, transformOrigin: "50% 100%" }, 10.894);
        tl.to("#map-card3", { opacity: 0, y: 60, duration: 0.25 }, 12.029);
        tl.to("#map-cam", { x: 0, y: -60, scale: 1, duration: 1.0, ease: "power2.inOut" }, 12.279);
        tl.fromTo("#map-end", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 13.179);
        tl.fromTo("#map-note", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 13.479);
        legState.forEach((s, i) => drawLeg(i));
        window.__timelines["map"] = tl;
