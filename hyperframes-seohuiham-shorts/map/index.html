<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>서희함 · 지도 여행</title>
    <script src="gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #cfe2e8;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #cfe2e8;
      }
    </style>
  </head>
  <body>
    <!-- ④ map journey short. Map is a concept sketch from approximate coordinates; score: Lyria 3 Pro cut. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="21" data-width="1080" data-height="1920">
      <div id="map" data-composition-id="map" data-composition-src="compositions/map.html"
        data-start="0" data-duration="21" data-track-index="0" data-width="1080" data-height="1920"></div>
      <audio id="soundtrack" src="assets/music.mp3" data-start="0" data-duration="21" data-track-index="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
