<!doctype html>
<html lang="ko"><head><meta charset="utf-8" />
<style>
  @font-face { font-family: P; font-weight: 500; src: url("assets/Pretendard-Medium.woff2"); }
  @font-face { font-family: P; font-weight: 700; src: url("assets/Pretendard-Bold.woff2"); }
  body { margin: 0; width: 1920px; height: 1080px; background: #000; font-family: P, sans-serif; }
  #f { position: relative; width: 1920px; height: 1080px; background: url("assets/scene-hanok.png") center / cover; overflow: hidden; }
  .line { position: absolute; left: 0; right: 0; border-top: 3px dashed; }
  .lab { position: absolute; left: 24px; padding: 6px 14px; border-radius: 8px; font-size: 30px; font-weight: 700; color: #fff; }
  #mayor { position: absolute; left: 330px; top: 150px; width: 520px; height: 930px; border: 4px solid #39e07a; border-radius: 260px 260px 40px 40px;
           background: rgba(57, 224, 122, 0.18); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
           font-size: 52px; font-weight: 700; color: #fff; text-shadow: 0 2px 10px #000; }
  #note { position: absolute; right: 24px; bottom: 20px; padding: 14px 20px; border-radius: 12px; background: rgba(0,0,0,0.7); color: #fff;
          font-size: 26px; font-weight: 500; line-height: 1.5; }
</style></head><body><div id="f">
  <div id="mayor">시장님 위치<span style="font-size:32px;font-weight:500;margin-top:8px">화면 가로 17~44%</span></div>
  <div class="line" style="top:150px;border-color:#ffd24a"></div><div class="lab" style="top:104px;background:#c99400">머리 끝 ≈ 화면 위에서 14%</div>
  <div class="line" style="top:282px;border-color:#ff6a6a"></div><div class="lab" style="top:236px;background:#d63b3b">눈높이 ≈ 26% (서희와 같은 높이)</div>
  <div class="line" style="top:665px;border-color:#7ab8ff"></div><div class="lab" style="top:619px;background:#2f6fd0">허리 ≈ 62%</div>
  <div id="note">· 카메라 고정(삼각대), 가슴 높이, 50mm 전후<br />· 화면 아래 끝 = 허벅지 중간 (서희와 같은 크기)<br />· 빛: 정면 + 왼쪽에서 부드럽게 (낮 햇빛 느낌)<br />· 시선: 1~5·9~11번은 카메라, 7번은 오른쪽(서희) 보기<br />· 화면 밖에서 서희 대사(6·8번)를 읽어 줄 사람 배치</div>
</div></body></html>
