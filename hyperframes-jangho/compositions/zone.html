      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#zone-fade", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, 0);
        tl.fromTo("#zone-video", { scale: 1.05 }, { scale: 1.12, duration: 10.3, ease: "none" }, 0);
        tl.fromTo("#zone-tag", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.4);
        tl.fromTo("#zone-h", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power4.out" }, 0.9);
        tl.fromTo("#zone-c1", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 2.6);
        { const o = { v: 0 }; tl.to(o, { v: 470, duration: 1.4, ease: "power2.out", onUpdate: () => { const v = o.v; document.querySelector("#zone-c1-n").textContent = Math.round(v).toLocaleString("en-US"); } }, 2.6); }
        tl.fromTo("#zone-c2", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 3.9000000000000004);
        { const o = { v: 0 }; tl.to(o, { v: 26, duration: 1.4, ease: "power2.out", onUpdate: () => { const v = o.v; document.querySelector("#zone-c2-n").textContent = Math.round(v).toLocaleString("en-US"); } }, 3.9000000000000004); }
        tl.fromTo("#zone-c3", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 5.2);
        { const o = { v: 0 }; tl.to(o, { v: 5600, duration: 1.4, ease: "power2.out", onUpdate: () => { const v = o.v; document.querySelector("#zone-c3-n").textContent = Math.round(v).toLocaleString("en-US"); } }, 5.2); }
        tl.fromTo("#zone-badge", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power4.out" }, 7.0);
        window.__timelines["zone"] = tl;
      </script>
