<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Black Han Sans";
          font-weight: 400;
          src: url("fonts/black-han-sans-latin-400-normal.woff2") format("woff2");
          unicode-range: U+0000-00FF, U+2190-21FF;
        }
        @font-face {
          font-family: "Black Han Sans";
          font-weight: 400;
          src: url("fonts/black-han-sans-korean-400-normal.woff2") format("woff2");
          unicode-range: U+1100-11FF, U+3130-318F, U+AC00-D7AF;
        }
        @font-face {
          font-family: "Noto Sans KR";
          font-weight: 500;
          src: url("fonts/noto-sans-kr-latin-500-normal.woff2") format("woff2");
          unicode-range: U+0000-00FF, U+2190-21FF;
        }
        @font-face {
          font-family: "Noto Sans KR";
          font-weight: 500;
          src: url("fonts/noto-sans-kr-korean-500-normal.woff2") format("woff2");
          unicode-range: U+1100-11FF, U+3130-318F, U+AC00-D7AF;
        }
        @font-face {
          font-family: "Noto Sans KR";
          font-weight: 800;
          src: url("fonts/noto-sans-kr-latin-800-normal.woff2") format("woff2");
          unicode-range: U+0000-00FF, U+2190-21FF;
        }
        @font-face {
          font-family: "Noto Sans KR";
          font-weight: 800;
          src: url("fonts/noto-sans-kr-korean-800-normal.woff2") format("woff2");
          unicode-range: U+1100-11FF, U+3130-318F, U+AC00-D7AF;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Noto Sans KR", sans-serif;
        }
        #plain-fade {
          position: absolute;
          inset: 0;
          background: #000;
        }
        #plain-img {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        #plain-shade {
          position: absolute;
          inset: 0;
          background: linear-gradient(180deg, rgba(5, 12, 26, 0.6) 0%, rgba(5, 12, 26, 0.35) 55%, rgba(5, 12, 26, 0.85) 100%);
        }
        .head {
          position: absolute;
          left: 0;
          right: 0;
          text-align: center;
          font-family: "Black Han Sans", sans-serif;
          color: #ffffff;
          text-shadow: 0 6px 30px rgba(0, 0, 0, 0.55);
        }
        .tag {
          position: absolute;
          left: 50%;
          transform: translateX(-50%);
          padding: 10px 30px;
          border: 3px solid #f2c25c;
          border-radius: 999px;
          font-size: 38px;
          font-weight: 800;
          color: #f2c25c;
          background: rgba(11, 26, 51, 0.7);
          white-space: nowrap;
        }
        .gold {
          color: #f2c25c;
        }
        #plain-tag {
          top: 150px;
        }
        #plain-h {
          top: 230px;
          font-size: 116px;
        }
      </style>
      <div id="root" data-composition-id="plain" data-width="1920" data-height="1080">
        <div id="plain-fade">
          <img id="plain-img" src="assets/plain.jpg" alt="" />
          <div id="plain-shade"></div>
          <div id="plain-tag" class="tag">장호원읍</div>
          <div id="plain-h" class="head">청미천의 너른 들,<br /><span class="gold">햇사레 복숭아</span>의 고장</div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#plain-fade", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, 0);
        tl.fromTo("#plain-img", { scale: 1.15, x: 60 }, { scale: 1.0, x: 0, duration: 6.8, ease: "none" }, 0);
        tl.fromTo("#plain-tag", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.5);
        tl.fromTo("#plain-h", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.9);
        window.__timelines["plain"] = tl;
      </script>
    </template>
  </body>
</html>
