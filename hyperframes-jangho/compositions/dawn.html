      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#dawn-fade", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, 0);
        tl.fromTo("#dawn-video", { scale: 1.0 }, { scale: 1.08, duration: 6.8, ease: "none" }, 0);
        tl.fromTo("#dawn-q1", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.0);
        tl.fromTo("#dawn-q2", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power4.out" }, 2.3);
        tl.to("#dawn-q1, #dawn-q2", { opacity: 0, duration: 0.4, ease: "none" }, 6.2);
        window.__timelines["dawn"] = tl;
      </script>
