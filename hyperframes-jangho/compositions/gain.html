<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Black Han Sans";
          font-weight: 400;
          src: url("fonts/black-han-sans-latin-400-normal.woff2") format("woff2");
          unicode-range: U+0000-00FF, U+2190-21FF;
        }
        @font-face {
          font-family: "Black Han Sans";
          font-weight: 400;
          src: url("fonts/black-han-sans-korean-400-normal.woff2") format("woff2");
          unicode-range: U+1100-11FF, U+3130-318F, U+AC00-D7AF;
        }
        @font-face {
          font-family: "Noto Sans KR";
          font-weight: 500;
          src: url("fonts/noto-sans-kr-latin-500-normal.woff2") format("woff2");
          unicode-range: U+0000-00FF, U+2190-21FF;
        }
        @font-face {
          font-family: "Noto Sans KR";
          font-weight: 500;
          src: url("fonts/noto-sans-kr-korean-500-normal.woff2") format("woff2");
          unicode-range: U+1100-11FF, U+3130-318F, U+AC00-D7AF;
        }
        @font-face {
          font-family: "Noto Sans KR";
          font-weight: 800;
          src: url("fonts/noto-sans-kr-latin-800-normal.woff2") format("woff2");
          unicode-range: U+0000-00FF, U+2190-21FF;
        }
        @font-face {
          font-family: "Noto Sans KR";
          font-weight: 800;
          src: url("fonts/noto-sans-kr-korean-800-normal.woff2") format("woff2");
          unicode-range: U+1100-11FF, U+3130-318F, U+AC00-D7AF;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Noto Sans KR", sans-serif;
        }
        #gain-fade {
          position: absolute;
          inset: 0;
          background: #000;
        }
        #gain-video {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        #gain-shade {
          position: absolute;
          inset: 0;
          background: linear-gradient(180deg, rgba(5, 12, 26, 0.15) 0%, rgba(5, 12, 26, 0.35) 55%, rgba(5, 12, 26, 0.85) 100%);
        }
        .head {
          position: absolute;
          left: 0;
          right: 0;
          text-align: center;
          font-family: "Black Han Sans", sans-serif;
          color: #ffffff;
          text-shadow: 0 6px 30px rgba(0, 0, 0, 0.55);
        }
        .tag {
          position: absolute;
          left: 50%;
          transform: translateX(-50%);
          padding: 10px 30px;
          border: 3px solid #f2c25c;
          border-radius: 999px;
          font-size: 38px;
          font-weight: 800;
          color: #f2c25c;
          background: rgba(11, 26, 51, 0.7);
          white-space: nowrap;
        }
        .gold {
          color: #f2c25c;
        }
        #gain-shade {
          background: linear-gradient(180deg, rgba(5, 12, 26, 0.55) 0%, rgba(5, 12, 26, 0.75) 100%);
        }
        #gain-tag {
          top: 200px;
        }
        #gain-cards {
          position: absolute;
          top: 340px;
          left: 0;
          right: 0;
          display: flex;
          justify-content: center;
          gap: 48px;
        }
        .gain-card {
          width: 500px;
          padding: 40px 0 34px;
          border-radius: 28px;
          background: rgba(11, 26, 51, 0.78);
          border: 2px solid #f2c25c;
          text-align: center;
        }
        .gain-num {
          font-family: "Black Han Sans", sans-serif;
          font-size: 120px;
          line-height: 1.1;
          color: #f2c25c;
        }
        .gain-num small {
          font-size: 50px;
          margin-left: 6px;
        }
        .gain-lab {
          margin-top: 8px;
          font-size: 40px;
          font-weight: 500;
          color: #ffffff;
        }
        #gain-note {
          position: absolute;
          left: 0;
          right: 0;
          top: 700px;
          text-align: center;
          font-size: 30px;
          color: #dfe6f2;
        }
      </style>
      <div id="root" data-composition-id="gain" data-width="1920" data-height="1080">
        <div id="gain-fade">
          <video id="gain-video" src="assets/clips/aerial.mp4" data-start="0" data-duration="5.6" muted playsinline></video>
          <div id="gain-shade"></div>
          <div id="gain-tag" class="tag">경마공원이 오면, 이천은</div>
          <div id="gain-cards">
            <div id="gain-g1" class="gain-card">
              <div class="gain-num"><span id="gain-g1-n">0</span><small>억 원</small></div>
              <div class="gain-lab">연간 세입 효과</div>
            </div>
            <div id="gain-g2" class="gain-card">
              <div class="gain-num"><span id="gain-g2-n">0</span><small>명</small></div>
              <div class="gain-lab">근무 인력 이전</div>
            </div>
            <div id="gain-g3" class="gain-card">
              <div class="gain-num"><span id="gain-g3-n">0</span><small>만 명+</small></div>
              <div class="gain-lab">연간 방문객</div>
            </div>
          </div>
          <div id="gain-note">※ 이천시 추산 (과천 경마공원 규모 운영 기준)</div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#gain-fade", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, 0);
        tl.fromTo("#gain-video", { scale: 1.0 }, { scale: 1.08, duration: 5.6, ease: "none" }, 0);
        tl.fromTo("#gain-tag", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.2);
        tl.fromTo("#gain-g1", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.5);
        { const o = { v: 0 }; tl.to(o, { v: 490, duration: 1.2, ease: "power2.out", onUpdate: () => { const v = o.v; document.querySelector("#gain-g1-n").textContent = Math.round(v).toLocaleString("en-US"); } }, 0.5); }
        tl.fromTo("#gain-g2", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.2);
        { const o = { v: 0 }; tl.to(o, { v: 3000, duration: 1.2, ease: "power2.out", onUpdate: () => { const v = o.v; document.querySelector("#gain-g2-n").textContent = Math.round(v).toLocaleString("en-US"); } }, 1.2); }
        tl.fromTo("#gain-g3", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.9);
        { const o = { v: 0 }; tl.to(o, { v: 200, duration: 1.2, ease: "power2.out", onUpdate: () => { const v = o.v; document.querySelector("#gain-g3-n").textContent = Math.round(v).toLocaleString("en-US"); } }, 1.9); }
        tl.fromTo("#gain-note", { opacity: 0, y: 0 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 2.4);
        window.__timelines["gain"] = tl;
      </script>
    </template>
  </body>
</html>
