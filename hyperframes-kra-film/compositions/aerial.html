<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #aerial-fade {
          position: absolute;
          inset: 0;
          background: #000;
        }
        @font-face {
          font-family: "Black Han Sans";
          font-weight: 400;
          src: url("fonts/black-han-sans-latin-400-normal.woff2") format("woff2");
          unicode-range: U+0000-00FF, U+2190-21FF;
        }
        @font-face {
          font-family: "Black Han Sans";
          font-weight: 400;
          src: url("fonts/black-han-sans-korean-400-normal.woff2") format("woff2");
          unicode-range: U+1100-11FF, U+3130-318F, U+AC00-D7AF;
        }
        #aerial-frame {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #aerial-video {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        #aerial-vignette {
          position: absolute;
          inset: 0;
          background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.55) 100%);
        }
        .aerial-kicker {
          font-size: 40px;
          font-weight: 800;
          letter-spacing: 0.35em;
          color: #d9ec7c;
          text-shadow: 0 2px 18px rgba(0, 0, 0, 0.6);
        }
        .aerial-big {
          font-family: "Black Han Sans", sans-serif;
          font-size: 150px;
          line-height: 1.1;
          color: #ffffff;
          text-shadow: 0 6px 40px rgba(0, 0, 0, 0.55);
        }
        #aerial-title {
          position: absolute;
          left: 0;
          right: 0;
          top: 330px;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
        }
        #aerial-big {
          margin-top: 10px;
          font-size: 190px;
        }
      </style>
      <div id="root" data-composition-id="aerial" data-width="1920" data-height="1080">
        <div id="aerial-fade">
          <div id="aerial-frame">
            <video id="aerial-video" src="assets/clips/aerial.mp4" data-start="0" data-duration="8" muted playsinline></video>
          </div>
          <div id="aerial-vignette"></div>
          <div id="aerial-title">
            <div id="aerial-kicker" class="aerial-kicker">미래가 모이는 도시</div>
            <div id="aerial-big" class="aerial-big">이천</div>
          </div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#aerial-fade", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "none" }, 0);
        tl.fromTo("#aerial-frame", { scale: 1 }, { scale: 1.05, duration: 8, ease: "none" }, 0);
        tl.fromTo("#aerial-kicker", { opacity: 0, scale: 1.08, filter: "blur(18px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, 5.1);
        tl.fromTo("#aerial-big", { opacity: 0, scale: 1.08, filter: "blur(18px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 1.0, ease: "power3.out" }, 5.4);
        window.__timelines["aerial"] = tl;
      </script>
    </template>
  </body>
</html>
