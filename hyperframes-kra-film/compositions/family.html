<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #family-fade {
          position: absolute;
          inset: 0;
          background: #000;
        }
        @font-face {
          font-family: "Black Han Sans";
          font-weight: 400;
          src: url("fonts/black-han-sans-latin-400-normal.woff2") format("woff2");
          unicode-range: U+0000-00FF, U+2190-21FF;
        }
        @font-face {
          font-family: "Black Han Sans";
          font-weight: 400;
          src: url("fonts/black-han-sans-korean-400-normal.woff2") format("woff2");
          unicode-range: U+1100-11FF, U+3130-318F, U+AC00-D7AF;
        }
        #family-frame {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #family-video {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        #family-vignette {
          position: absolute;
          inset: 0;
          background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.55) 100%);
        }
        .family-kicker {
          font-size: 40px;
          font-weight: 800;
          letter-spacing: 0.35em;
          color: #d9ec7c;
          text-shadow: 0 2px 18px rgba(0, 0, 0, 0.6);
        }
        .family-big {
          font-family: "Black Han Sans", sans-serif;
          font-size: 150px;
          line-height: 1.1;
          color: #ffffff;
          text-shadow: 0 6px 40px rgba(0, 0, 0, 0.55);
        }
        #family-shade {
          position: absolute;
          inset: 0;
          background: linear-gradient(90deg, rgba(0, 0, 0, 0.55) 0%, rgba(0, 0, 0, 0) 55%);
        }
        #family-title {
          position: absolute;
          left: 140px;
          bottom: 260px;
        }
        #family-big {
          margin-top: 10px;
          font-size: 104px;
        }
      </style>
      <div id="root" data-composition-id="family" data-width="1920" data-height="1080">
        <div id="family-fade">
          <div id="family-frame">
            <video id="family-video" src="assets/clips/family.mp4" data-start="0" data-duration="7.8" muted playsinline></video>
          </div>
          <div id="family-vignette"></div>
          <div id="family-shade"></div>
          <div id="family-title">
            <div id="family-kicker" class="family-kicker">온 가족이 즐기는</div>
            <div id="family-big" class="family-big">365일 말문화 복합공원</div>
          </div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#family-fade", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "none" }, 0);
        tl.fromTo("#family-frame", { scale: 1 }, { scale: 1.06, duration: 7.8, ease: "none" }, 0);
        tl.fromTo("#family-shade", { opacity: 0 }, { opacity: 1, duration: 0.8 }, 0.6);
        tl.fromTo("#family-kicker", { opacity: 0, scale: 1.08, filter: "blur(18px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "power3.out" }, 0.9);
        tl.fromTo("#family-big", { opacity: 0, scale: 1.08, filter: "blur(18px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.8, ease: "power3.out" }, 1.1);
        window.__timelines["family"] = tl;
      </script>
    </template>
  </body>
</html>
