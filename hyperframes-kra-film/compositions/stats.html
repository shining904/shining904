<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #stats-fade {
          position: absolute;
          inset: 0;
          background: #000;
        }
        #stats-video {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
        }
      </style>
      <div id="root" data-composition-id="stats" data-width="1920" data-height="1080">
        <div id="stats-fade">
          <video id="stats-video" src="assets/stats.mp4" data-start="0" data-duration="8" muted playsinline></video>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#stats-fade", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "none" }, 0);
        window.__timelines["stats"] = tl;
      </script>
    </template>
  </body>
</html>
