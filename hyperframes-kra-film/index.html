<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>한국마사회 이천 유치 시네마틱</title>
    <script src="gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Noto Sans KR";
        font-weight: 500;
        src: url("fonts/noto-sans-kr-latin-500-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+2190-21FF;
      }
      @font-face {
        font-family: "Noto Sans KR";
        font-weight: 500;
        src: url("fonts/noto-sans-kr-korean-500-normal.woff2") format("woff2");
        unicode-range: U+1100-11FF, U+3130-318F, U+AC00-D7AF;
      }
      @font-face {
        font-family: "Noto Sans KR";
        font-weight: 800;
        src: url("fonts/noto-sans-kr-latin-800-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+2190-21FF;
      }
      @font-face {
        font-family: "Noto Sans KR";
        font-weight: 800;
        src: url("fonts/noto-sans-kr-korean-800-normal.woff2") format("woff2");
        unicode-range: U+1100-11FF, U+3130-318F, U+AC00-D7AF;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Noto Sans KR", sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- Live-action clips: Magnific Seedance 2.5. Scene "stats": Remotion (remotion/src/Kra/StatsScene.tsx). -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="62"
      data-width="1920"
      data-height="1080"
    >
      <div id="dawn" data-composition-id="dawn" data-composition-src="compositions/dawn.html"
        data-start="0" data-duration="8.0" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="race" data-composition-id="race" data-composition-src="compositions/race.html"
        data-start="7.7" data-duration="6.8" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="stats" data-composition-id="stats" data-composition-src="compositions/stats.html"
        data-start="14.5" data-duration="8.0" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="family" data-composition-id="family" data-composition-src="compositions/family.html"
        data-start="22.3" data-duration="7.8" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="farm" data-composition-id="farm" data-composition-src="compositions/farm.html"
        data-start="29.9" data-duration="8.0" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="people" data-composition-id="people" data-composition-src="compositions/people.html"
        data-start="37.8" data-duration="6.5" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="aerial" data-composition-id="aerial" data-composition-src="compositions/aerial.html"
        data-start="44.2" data-duration="8.0" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html"
        data-start="52.0" data-duration="10.0" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="caps" data-composition-id="caps" data-composition-src="compositions/caps.html"
        data-start="0" data-duration="62" data-track-index="2" data-width="1920" data-height="1080"></div>
      <audio id="soundtrack" src="assets/audio/mix.mp3" data-start="0" data-duration="61.9" data-track-index="3"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
