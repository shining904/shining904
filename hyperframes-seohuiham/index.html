<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>천 년의 지혜, 바다를 지키다</title>
    <script src="gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
    </style>
  </head>
  <body>
    <!-- 서희함 진수 축하 영상 (웅장한 버전). Clips: Magnific Seedance 2.5 (+ veed lipsync); title-scene
         submarine: Meshy 7.1 rendered in Blender Cycles; sea and sonar: Canvas 2D; score: Lyria 3 Pro. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="73" data-width="1920" data-height="1080">
      <div id="open" data-composition-id="open" data-composition-src="compositions/open.html"
        data-start="0" data-duration="7.6" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="cliff" data-composition-id="cliff" data-composition-src="compositions/cliff.html"
        data-start="7.0" data-duration="8.4" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="front" data-composition-id="front" data-composition-src="compositions/front.html"
        data-start="15.0" data-duration="8.4" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div id="side" data-composition-id="side" data-composition-src="compositions/side.html"
        data-start="23.0" data-duration="8.4" data-track-index="3" data-width="1920" data-height="1080"></div>
      <div id="title" data-composition-id="title" data-composition-src="compositions/title.html"
        data-start="31.0" data-duration="15.9" data-track-index="4" data-width="1920" data-height="1080"></div>
      <div id="speech" data-composition-id="speech" data-composition-src="compositions/speech.html"
        data-start="46.4" data-duration="14.6" data-track-index="5" data-width="1920" data-height="1080"></div>
      <div id="finale" data-composition-id="finale" data-composition-src="compositions/finale.html"
        data-start="60.6" data-duration="12.4" data-track-index="6" data-width="1920" data-height="1080"></div>
      <div id="caps" data-composition-id="caps" data-composition-src="compositions/caps.html"
        data-start="0" data-duration="73" data-track-index="7" data-width="1920" data-height="1080"></div>
      <audio id="soundtrack" src="assets/audio/mix.mp3" data-start="0" data-duration="73" data-track-index="8"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
