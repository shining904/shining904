<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>천 년의 지혜, 바다를 지키다</title>
    <script src="gsap.min.js"></script>
    <script src="p5.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
    </style>
  </head>
  <body>
    <!-- 서희함 진수 축하 영상. Clips: Magnific Seedance 2.5 (+ veed lipsync); submarine: Meshy 7.1
         rendered in Blender Cycles; map: p5.js; sea: Canvas 2D; score: Lyria 3 Pro. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="78" data-width="1920" data-height="1080">
      <div id="ink" data-composition-id="ink" data-composition-src="compositions/ink.html"
        data-start="0" data-duration="34.5" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="camp" data-composition-id="camp" data-composition-src="compositions/camp.html"
        data-start="10.0" data-duration="8.4" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="tent" data-composition-id="tent" data-composition-src="compositions/tent.html"
        data-start="18.0" data-duration="8.4" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div id="ocean" data-composition-id="ocean" data-composition-src="compositions/ocean.html"
        data-start="33.5" data-duration="19.0" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="sub" data-composition-id="sub" data-composition-src="compositions/sub.html"
        data-start="36.0" data-duration="16.0" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div id="speech" data-composition-id="speech" data-composition-src="compositions/speech.html"
        data-start="52.0" data-duration="15.2" data-track-index="3" data-width="1920" data-height="1080"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html"
        data-start="66.8" data-duration="11.2" data-track-index="4" data-width="1920" data-height="1080"></div>
      <div id="caps" data-composition-id="caps" data-composition-src="compositions/caps.html"
        data-start="0" data-duration="78" data-track-index="5" data-width="1920" data-height="1080"></div>
      <audio id="soundtrack" src="assets/audio/mix.mp3" data-start="0" data-duration="78" data-track-index="6"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
