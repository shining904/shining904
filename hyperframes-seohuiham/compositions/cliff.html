          unicode-range: U+1100-11FF, U+3130-318F, U+AC00-D7AF;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #cliff-fade {
          position: absolute;
          inset: 0;
          background: #000;
        }
        #cliff-video {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
          
        }
        #cliff-bars {
          position: absolute;
          inset: 0;
          background: linear-gradient(180deg, rgba(0, 0, 0, 0.55) 0%, rgba(0, 0, 0, 0) 18%, rgba(0, 0, 0, 0) 78%, rgba(0, 0, 0, 0.6) 100%);
        }
        .ttl {
          position: absolute;
          left: 0;
          right: 0;
          text-align: center;
          font-family: "Nanum Myeongjo", serif;
          font-weight: 800;
          color: #f7efe0;
          text-shadow: 0 6px 40px rgba(0, 0, 0, 0.7);
        }
        .gold {
          background: linear-gradient(180deg, #fff3cf 0%, #e3b25a 45%, #9a6a1c 100%);
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
          text-shadow: none;
          filter: drop-shadow(0 4px 24px rgba(0, 0, 0, 0.6));
        }
        #cliff-name {
          left: 140px;
          right: auto;
          top: 700px;
          text-align: left;
          font-size: 120px;
        }
        #cliff-sub {
          left: 146px;
          right: auto;
          top: 850px;
          text-align: left;
          font-family: "Noto Sans KR", sans-serif;

          font-size: 30px;
          letter-spacing: 10px;
        }
      </style>
      <div id="root" data-composition-id="cliff" data-width="1920" data-height="1080">
        <div id="cliff-fade">
          <video id="cliff-video" src="assets/clips/cliff.mp4" data-start="0" data-duration="8.4" muted playsinline></video>
          <div id="cliff-bars"></div>
          <div id="cliff-name" class="ttl gold">서희 徐熙</div>
          <div id="cliff-sub" class="ttl">고려의 외교관 · 942–998</div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#cliff-fade", { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "none" }, 0);
        tl.fromTo("#cliff-video", { scale: 1.04 }, { scale: 1.0, duration: 8.4, ease: "none" }, 0);
        tl.fromTo("#cliff-name", { opacity: 0, scale: 1.12, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 1.6, ease: "power2.out" }, 2.8);
        tl.fromTo("#cliff-sub", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 3.6);
        tl.to("#cliff-name, #cliff-sub", { opacity: 0, duration: 0.8, ease: "power1.in" }, 7.2);
        window.__timelines["cliff"] = tl;
      </script>
