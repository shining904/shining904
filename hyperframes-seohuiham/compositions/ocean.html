<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Nanum Myeongjo";
          font-weight: 800;
          src: url("fonts/nanum-myeongjo-latin-800-normal.woff2") format("woff2");
          unicode-range: U+0000-00FF;
        }
        @font-face {
          font-family: "Nanum Myeongjo";
          font-weight: 800;
          src: url("fonts/nanum-myeongjo-korean-800-normal.woff2") format("woff2");
          unicode-range: U+1100-11FF, U+3130-318F, U+AC00-D7AF, U+4E00-9FFF;
        }
        @font-face {
          font-family: "Noto Sans KR";
          font-weight: 500;
          src: url("fonts/noto-sans-kr-latin-500-normal.woff2") format("woff2");
          unicode-range: U+0000-00FF, U+2160-216F;
        }
        @font-face {
          font-family: "Noto Sans KR";
          font-weight: 500;
          src: url("fonts/noto-sans-kr-korean-500-normal.woff2") format("woff2");
          unicode-range: U+1100-11FF, U+3130-318F, U+AC00-D7AF;
        }
        @font-face {
          font-family: "Noto Sans KR";
          font-weight: 800;
          src: url("fonts/noto-sans-kr-latin-800-normal.woff2") format("woff2");
          unicode-range: U+0000-00FF, U+2160-216F;
        }
        @font-face {
          font-family: "Noto Sans KR";
          font-weight: 800;
          src: url("fonts/noto-sans-kr-korean-800-normal.woff2") format("woff2");
          unicode-range: U+1100-11FF, U+3130-318F, U+AC00-D7AF;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #ocean-cv {
          position: absolute;
          inset: 0;
        }
        #ocean-facts {
          position: absolute;
          left: 120px;
          top: 110px;
        }
        #ocean-name {
          font-family: "Nanum Myeongjo", serif;
          font-weight: 800;
          font-size: 120px;
          line-height: 1.05;
          color: #ffffff;
          text-shadow: 0 0 40px rgba(80, 170, 255, 0.45);
        }
        #ocean-en {
          margin-top: 6px;
          font-family: "Noto Sans KR", sans-serif;
          font-weight: 500;
          font-size: 30px;
          letter-spacing: 14px;
          color: #9fd4ff;
        }
        .ocean-row {
          margin-top: 18px;
          font-family: "Noto Sans KR", sans-serif;
          font-weight: 800;
          font-size: 36px;
          color: #e8f4ff;
        }
        .ocean-row b {
          color: #d9a441;
          margin-right: 16px;
        }
      </style>
      <div id="root" data-composition-id="ocean" data-width="1920" data-height="1080">
        <canvas id="ocean-cv" width="1920" height="1080"></canvas>
        <div id="ocean-facts">
          <div id="ocean-name">서희함</div>
          <div id="ocean-en">ROKS SEO HUI</div>
          <div id="ocean-r1" class="ocean-row"><b>장보고-Ⅲ 배치-Ⅱ</b>2번함</div>
          <div id="ocean-r2" class="ocean-row"><b>3,600톤급</b>잠수함</div>
          <div id="ocean-r3" class="ocean-row"><b>2026. 11. 3.</b>진수</div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const cv = document.getElementById("ocean-cv"), ctx = cv.getContext("2d");
        const W = 1920, H = 1080;
        const rnd = (i, k) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };
        function render(t) {
          // ink settles into water: paper tone fades to deep blue in the first 2.5 s
          const m = Math.min(1, t / 2.5);
          const g = ctx.createLinearGradient(0, 0, 0, H);
          g.addColorStop(0, `rgb(${Math.round(239 - 225 * m)},${Math.round(230 - 170 * m)},${Math.round(210 - 100 * m)})`);
          g.addColorStop(1, `rgb(${Math.round(239 - 237 * m)},${Math.round(230 - 218 * m)},${Math.round(210 - 180 * m)})`);
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, W, H);
          // light shafts from the surface, swaying
          ctx.globalCompositeOperation = "lighter";
          for (let i = 0; i < 9; i++) {
            const x = 150 + i * 210 + Math.sin(t * 0.4 + i) * 60, w = 70 + rnd(i, 1) * 120;
            const s = ctx.createLinearGradient(0, 0, 0, H);
            s.addColorStop(0, `rgba(120,200,255,${0.16 * m})`);
            s.addColorStop(1, "rgba(120,200,255,0)");
            ctx.fillStyle = s;
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x + w, 0);
            ctx.lineTo(x + w * 2.6 - 300, H);
            ctx.lineTo(x - 300, H);
            ctx.fill();
          }
          // caustic shimmer near the top
          for (let i = 0; i < 26; i++) {
            const x = rnd(i, 2) * W + Math.sin(t * 0.6 + i) * 40, y = rnd(i, 3) * 220;
            const a = (0.04 + 0.03 * Math.sin(t * 1.5 + i)) * m, r = 120 + rnd(i, 10) * 160;
            const cg = ctx.createRadialGradient(x, y, 0, x, y, r);
            cg.addColorStop(0, `rgba(170,230,255,${a})`);
            cg.addColorStop(1, "rgba(170,230,255,0)");
            ctx.fillStyle = cg;
            ctx.fillRect(x - r, y - r, r * 2, r * 2);
          }
          ctx.globalCompositeOperation = "source-over";
          // drifting particles (marine snow), each a pure function of t
          for (let i = 0; i < 220; i++) {
            const x = (rnd(i, 4) * W + t * (8 + rnd(i, 5) * 20)) % W;
            const y = (rnd(i, 6) * H + t * (6 + rnd(i, 7) * 14)) % H;
            ctx.fillStyle = `rgba(200,230,255,${(0.15 + rnd(i, 8) * 0.35) * m})`;
            ctx.beginPath();
            ctx.arc(x, y, 1 + rnd(i, 9) * 2.2, 0, Math.PI * 2);
            ctx.fill();
          }
          // depth vignette
          const v = ctx.createRadialGradient(W / 2, H / 2, 300, W / 2, H / 2, 1150);
          v.addColorStop(0, "rgba(0,0,0,0)");
          v.addColorStop(1, `rgba(0,6,16,${0.75 * m})`);
          ctx.fillStyle = v;
          ctx.fillRect(0, 0, W, H);
        }
        const state = { t: 0 };
        tl.to(state, { t: 19, duration: 19, ease: "none", onUpdate: () => render(state.t) }, 0);
        tl.fromTo("#ocean-name", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 1.0, ease: "power3.out" }, 10.6);
        tl.fromTo("#ocean-en", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 11.2);
        tl.fromTo("#ocean-r1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 12.0);
        tl.fromTo("#ocean-r2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 12.6);
        tl.fromTo("#ocean-r3", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 13.2);
        tl.set("#ocean-name, #ocean-en, .ocean-row", { opacity: 0 }, 0);
        window.__timelines["ocean"] = tl;
      </script>
    </template>
  </body>
</html>
