      <div id="root" data-composition-id="ink" data-width="1920" data-height="1080">
        <div id="ink-host"></div>
        <div id="ink-y1" class="ink-year">993</div>
        <div id="ink-y2" class="ink-year">고려 성종 12년</div>
        <div id="ink-khitan" class="ink-lab">거란</div>
        <div id="ink-goryeo" class="ink-lab">고려</div>
        <div id="ink-gd">강동 6주</div>
        <div id="ink-gd-sub">압록강까지, 280리의 땅</div>
        <div id="ink-name">서희<small>徐熙 · 942–998</small></div>
        <div id="ink-note">개념도 · 실제 경계와 다를 수 있음</div>

      <script>
        const tl = gsap.timeline({ paused: true });
        const W = 1920, H = 1080;
        const COAST = [[1041.2, 367.4], [1082.8, 398.6], [1124.4, 409.0], [1155.6, 461.0], [1124.4, 492.2], [1145.2, 533.8], [1093.2, 565.0], [1176.4, 596.2], [1228.4, 596.2], [1280.4, 617.0], [1301.2, 669.0], [1270.0, 710.6], [1270.0, 773.0], [1290.8, 825.0], [1259.6, 897.8], [1280.4, 939.4], [1363.6, 918.6], [1426.0, 897.8], [1488.4, 887.4], [1540.4, 866.6], [1571.6, 825.0], [1582.0, 773.0], [1571.6, 710.6], [1561.2, 658.6], [1519.6, 596.2], [1478.0, 533.8], [1457.2, 502.6], [1405.2, 450.6], [1374.0, 429.8], [1384.4, 377.8], [1457.2, 357.0], [1519.6, 305.0], [1602.8, 263.4], [1613.2, 211.4], [1654.8, 149.0], [1706.8, 117.8], [1634.0, 55.4], [1561.2, 107.4], [1519.6, 149.0], [1436.4, 149.0], [1374.0, 180.2], [1311.6, 169.8], [1249.2, 221.8], [1155.6, 294.6], [1103.6, 325.8], [1041.2, 367.4]], YALU = [[1041.2, 367.4], [1103.6, 325.8], [1155.6, 294.6], [1249.2, 221.8], [1311.6, 169.8], [1374.0, 180.2], [1436.4, 149.0]], SIX = [[1077.6, 331.0], [1098.4, 362.2], [1129.6, 351.8], [1119.2, 383.0], [1160.8, 357.0], [1155.6, 388.2]];
        const clamp = (v) => Math.max(0, Math.min(1, v));
        const prog = (t, a, b) => clamp((t - a) / (b - a));
        const ease = (x) => 1 - Math.pow(1 - x, 3);
        let P = null, paper = null;
        new p5(function (p) {
          p.setup = function () {
            p.createCanvas(W, H).parent(document.getElementById("ink-host"));
            p.pixelDensity(1);
            p.noLoop();
            paper = p.createGraphics(W, H);
            paper.pixelDensity(1);
            paper.randomSeed(4);
            paper.background(239, 230, 210);
            paper.noStroke();
            for (let i = 0; i < 14000; i++) {
              const g = paper.random(-16, 10);
              paper.fill(206 + g, 192 + g, 166 + g, paper.random(14, 40));
              paper.circle(paper.random(W), paper.random(H), paper.random(1, 3));
            }
            P = p;
          };
          p.draw = function () {};
        });
        function path(pts, upto) {
          const n = Math.max(1, Math.floor((pts.length - 1) * upto));
          const ctx = P.drawingContext;
          ctx.beginPath();
          ctx.moveTo(pts[0][0], pts[0][1]);
          for (let i = 1; i <= n; i++) ctx.lineTo(pts[i][0], pts[i][1]);
          return ctx;
        }
        function render(t) {
          if (!P) return;
          P.randomSeed(9);
          P.noiseSeed(9);
          const ctx = P.drawingContext;
          P.image(paper, 0, 0);
          // coastline brushed in, then a pale wash inside
          const c = ease(prog(t, 0.2, 2.6));
          ctx.lineJoin = "round";
          ctx.lineCap = "round";
          for (let k = 0; k < 3; k++) {
            ctx.save();
            ctx.translate((P.noise(k) - 0.5) * 3, (P.noise(k + 9) - 0.5) * 3);
            path(COAST, c);
            ctx.strokeStyle = `rgba(29,26,23,${0.55 - k * 0.12})`;
            ctx.lineWidth = 5 - k * 1.2;
            ctx.stroke();
            ctx.restore();
          }
          if (c >= 1) {
            path(COAST, 1);
            ctx.closePath();
            ctx.fillStyle = "rgba(120,96,60,0.10)";
            ctx.fill();
          }
          // Khitan ink bleeding down from the north, stopping at the river (t 2.5-8)
          const k = ease(prog(t, 2.5, 8.0)) * (1 - prog(t, 25.6, 27.6));
          if (k > 0) {
            for (let i = 0; i < 70; i++) {
              const bx = 1000 + P.noise(i * 0.3) * 760, by = -60 + P.noise(i * 0.3, 5) * 180;
              const r = (70 + P.noise(i, 2) * 160) * k;
              const g = ctx.createRadialGradient(bx, by + 120 * k, 0, bx, by + 120 * k, r);
              g.addColorStop(0, `rgba(20,18,16,${0.55 * k})`);
              g.addColorStop(1, "rgba(20,18,16,0)");
              ctx.fillStyle = g;
              ctx.fillRect(bx - r, by + 120 * k - r, r * 2, r * 2);
            }
            // spearheads pushing south across the river
            for (let a = 0; a < 3; a++) {
              const ax = 1090 + a * 120, len = 120 + 140 * prog(t, 4 + a * 0.4, 8);
              ctx.strokeStyle = `rgba(122,43,31,${0.85 * k})`;
              ctx.lineWidth = 9;
              ctx.beginPath();
              ctx.moveTo(ax, 150);
              ctx.lineTo(ax + 20, 150 + len);
              ctx.stroke();
              ctx.beginPath();
              ctx.moveTo(ax + 20 - 18, 150 + len - 26);
              ctx.lineTo(ax + 20, 150 + len);
              ctx.lineTo(ax + 20 + 22, 150 + len - 22);
              ctx.stroke();
            }
          }
          // 강동 6주: the border along the Yalu drawn in gold, six fortresses lighting up (t 27-31)
          const y = ease(prog(t, 27.4, 30.0));
          if (y > 0) {
            ctx.shadowColor = "rgba(217,164,65,0.9)";
            ctx.shadowBlur = 20;
            path(YALU, y);
            ctx.strokeStyle = "#d9a441";
            ctx.lineWidth = 12;
            ctx.stroke();
            ctx.shadowBlur = 0;
            SIX.forEach(([sx, sy], i) => {
              const s = ease(prog(t, 28.6 + i * 0.25, 29.2 + i * 0.25));
              if (s <= 0) return;
              ctx.fillStyle = "rgba(217,164,65,0.35)";
              ctx.beginPath();
              ctx.arc(sx, sy, 30 * s, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = "#b5781d";
              ctx.beginPath();
              ctx.arc(sx, sy, 10 * s, 0, Math.PI * 2);
              ctx.fill();
            });
          }
        }
        const state = { t: 0 };
        tl.to(state, { t: 34.5, duration: 34.5, ease: "none", onUpdate: () => render(state.t) }, 0);
        tl.fromTo("#ink-host", { scale: 1.0 }, { scale: 1.06, duration: 10, ease: "sine.inOut" }, 0);
        tl.set("#ink-host", { transformOrigin: "1120px 330px" }, 0);
        tl.to("#ink-host", { scale: 1.6, x: -250, y: 150, duration: 3.5, ease: "power2.inOut" }, 26.0);
        tl.fromTo("#ink-y1", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 1.0, ease: "power3.out" }, 0.8);
        tl.fromTo("#ink-y2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 1.4);
        tl.fromTo("#ink-khitan", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 3.0);
        tl.fromTo("#ink-goryeo", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 1.8);
        tl.to("#ink-y1, #ink-y2, #ink-khitan, #ink-goryeo", { opacity: 0, duration: 0.6, ease: "power1.in" }, 9.0);
        tl.fromTo("#ink-gd", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 28.0);
        tl.fromTo("#ink-gd-sub", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 28.8);
        tl.fromTo("#ink-name", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 31.0);
        tl.fromTo("#ink-note", { opacity: 0, y: 0 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 27.5);
        tl.to("#ink-gd, #ink-gd-sub, #ink-name, #ink-note", { opacity: 0, duration: 0.5, ease: "power1.in" }, 33.6);
        window.__timelines["ink"] = tl;
      </script>
