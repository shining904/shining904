      <div id="root" data-composition-id="ink" data-width="1920" data-height="1080">
        <div id="ink-cam">
          <img id="ink-table" src="assets/img/table1.png" alt="" />
          <div id="ink-host"></div>
          <div id="ink-y1" class="ink-w">993</div>
          <div id="ink-y2" class="ink-w">고려 성종 12년</div>
          <div id="ink-khitan" class="ink-w">거란</div>
          <div id="ink-goryeo" class="ink-w">고려</div>
          <div id="ink-gd" class="ink-w">강동 6주</div>
          <div id="ink-gd-sub" class="ink-w">압록강까지, 280리의 땅</div>
          <div id="ink-name" class="ink-w">서희<small>徐熙 · 942–998</small></div>
          <div id="ink-flicker"></div>
        </div>
        <div id="ink-note">개념도 · 실제 경계와 다를 수 있음</div>

      <script>
        const tl = gsap.timeline({ paused: true });
        const W = 1920, H = 1080;
        const COAST = [[921.2, 485.4], [942.8, 501.6], [964.4, 507.0], [980.6, 534.0], [964.4, 550.2], [975.2, 571.8], [948.2, 588.0], [991.4, 604.2], [1018.4, 604.2], [1045.4, 615.0], [1056.2, 642.0], [1040.0, 663.6], [1040.0, 696.0], [1050.8, 723.0], [1034.6, 760.8], [1045.4, 782.4], [1088.6, 771.6], [1121.0, 760.8], [1153.4, 755.4], [1180.4, 744.6], [1196.6, 723.0], [1202.0, 696.0], [1196.6, 663.6], [1191.2, 636.6], [1169.6, 604.2], [1148.0, 571.8], [1137.2, 555.6], [1110.2, 528.6], [1094.0, 517.8], [1099.4, 490.8], [1137.2, 480.0], [1169.6, 453.0], [1212.8, 431.4], [1218.2, 404.4], [1239.8, 372.0], [1266.8, 355.8], [1229.0, 323.4], [1191.2, 350.4], [1169.6, 372.0], [1126.4, 372.0], [1094.0, 388.2], [1061.6, 382.8], [1029.2, 409.8], [980.6, 447.6], [953.6, 463.8], [921.2, 485.4]], YALU = [[921.2, 485.4], [953.6, 463.8], [980.6, 447.6], [1029.2, 409.8], [1061.6, 382.8], [1094.0, 388.2], [1126.4, 372.0]], SIX = [[940.1, 466.5], [950.9, 482.7], [967.1, 477.3], [961.7, 493.5], [983.3, 480.0], [980.6, 496.2]];
        const PAPER = [650, 300, 1335, 832];   // ink stays on the paper
        const clamp = (v) => Math.max(0, Math.min(1, v));
        const prog = (t, a, b) => clamp((t - a) / (b - a));
        const ease = (x) => 1 - Math.pow(1 - x, 3);
        let P = null;
        new p5(function (p) {
          p.setup = function () {
            p.createCanvas(W, H).parent(document.getElementById("ink-host"));
            p.pixelDensity(1);
            p.noLoop();
            P = p;
          };
          p.draw = function () {};
        });
        function path(pts, upto) {
          const n = Math.max(1, Math.floor((pts.length - 1) * upto));
          const ctx = P.drawingContext;
          ctx.beginPath();
          ctx.moveTo(pts[0][0], pts[0][1]);
          for (let i = 1; i <= n; i++) ctx.lineTo(pts[i][0], pts[i][1]);
          return ctx;
        }
        function render(t) {
          if (!P) return;
          P.clear();
          P.randomSeed(9);
          P.noiseSeed(9);
          const ctx = P.drawingContext;
          ctx.save();
          ctx.beginPath();
          ctx.rect(PAPER[0], PAPER[1], PAPER[2] - PAPER[0], PAPER[3] - PAPER[1]);
          ctx.clip();
          // coastline brushed in with a dry ink brush
          const c = ease(prog(t, 0.4, 3.0));
          ctx.lineJoin = "round";
          ctx.lineCap = "round";
          for (let k = 0; k < 4; k++) {
            ctx.save();
            ctx.translate((P.noise(k) - 0.5) * 2.4, (P.noise(k + 9) - 0.5) * 2.4);
            path(COAST, c);
            ctx.strokeStyle = `rgba(28,22,16,${0.5 - k * 0.1})`;
            ctx.lineWidth = 3.4 - k * 0.7;
            ctx.stroke();
            ctx.restore();
          }
          if (c >= 1) {
            path(COAST, 1);
            ctx.closePath();
            ctx.fillStyle = "rgba(120,90,50,0.10)";
            ctx.fill();
          }
          // Khitan ink soaking into the paper from the north edge
          const k = ease(prog(t, 2.6, 8.0)) * (1 - prog(t, 25.6, 27.6));
          if (k > 0) {
            for (let i = 0; i < 60; i++) {
              const bx = 960 + P.noise(i * 0.3) * 380, by = 300 + P.noise(i * 0.3, 5) * 40;
              const r = (30 + P.noise(i, 2) * 80) * k;
              const g = ctx.createRadialGradient(bx, by + 40 * k, 0, bx, by + 40 * k, r);
              g.addColorStop(0, `rgba(15,12,10,${0.6 * k})`);
              g.addColorStop(0.7, `rgba(15,12,10,${0.25 * k})`);
              g.addColorStop(1, "rgba(15,12,10,0)");
              ctx.fillStyle = g;
              ctx.fillRect(bx - r, by + 40 * k - r, r * 2, r * 2);
            }
            for (let a = 0; a < 3; a++) {
              const ax = 1010 + a * 70, len = 50 + 80 * prog(t, 4 + a * 0.4, 8);
              ctx.strokeStyle = `rgba(140,30,20,${0.85 * k})`;
              ctx.lineWidth = 5;
              ctx.beginPath();
              ctx.moveTo(ax, 360);
              ctx.lineTo(ax + 10, 360 + len);
              ctx.moveTo(ax + 10 - 11, 360 + len - 15);
              ctx.lineTo(ax + 10, 360 + len);
              ctx.lineTo(ax + 10 + 13, 360 + len - 12);
              ctx.stroke();
            }
          }
          ctx.restore();
          // 강동 6주 in gold leaf along the Yalu, the six fortresses pressed in like seals
          const y = ease(prog(t, 27.4, 30.0));
          if (y > 0) {
            ctx.shadowColor = "rgba(255,190,80,0.9)";
            ctx.shadowBlur = 10;
            path(YALU, y);
            ctx.strokeStyle = "#c8902a";
            ctx.lineWidth = 6;
            ctx.stroke();
            ctx.shadowBlur = 0;
            SIX.forEach(([sx, sy], i) => {
              const s = ease(prog(t, 28.6 + i * 0.25, 29.2 + i * 0.25));
              if (s <= 0) return;
              ctx.fillStyle = "rgba(200,144,42,0.35)";
              ctx.beginPath();
              ctx.arc(sx, sy, 12 * s, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = "#a8321f";
              ctx.fillRect(sx - 3.5 * s, sy - 3.5 * s, 7 * s, 7 * s);
            });
          }
        }
        const state = { t: 0 };
        tl.to(state, { t: 34.5, duration: 34.5, ease: "none", onUpdate: () => render(state.t) }, 0);
        // candle flicker
        tl.to(state, { duration: 34.5, ease: "none", onUpdate: () => {
          const f = 0.75 + 0.15 * Math.sin(state.t * 7.1) + 0.1 * Math.sin(state.t * 12.7 + 1);
          document.getElementById("ink-flicker").style.opacity = f;
        } }, 0);
        // camera: slow push over the table, then a move onto the north-west for 강동 6주
        tl.fromTo("#ink-cam", { scale: 1.08 }, { scale: 1.22, duration: 10, ease: "sine.inOut" }, 0);
        tl.set("#ink-cam", { transformOrigin: "959.0px 440.0px" }, 0);
        tl.to("#ink-cam", { scale: 2.1, x: 1.0, y: -10.0, duration: 3.5, ease: "power2.inOut" }, 26.0);
        tl.fromTo("#ink-y1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 1.2, ease: "power3.out" }, 1.0);
        tl.fromTo("#ink-y2", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 1.6);
        tl.fromTo("#ink-khitan", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 3.4);
        tl.fromTo("#ink-goryeo", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 2.4);
        tl.to("#ink-y1, #ink-y2, #ink-khitan, #ink-goryeo", { opacity: 0, duration: 0.6, ease: "power1.in" }, 9.0);
        tl.fromTo("#ink-gd", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 28.0);
        tl.fromTo("#ink-gd-sub", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 28.8);
        tl.fromTo("#ink-name", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 31.0);
        tl.fromTo("#ink-note", { opacity: 0, y: 0 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 27.5);
        tl.to("#ink-gd, #ink-gd-sub, #ink-name, #ink-note", { opacity: 0, duration: 0.5, ease: "power1.in" }, 33.6);
        window.__timelines["ink"] = tl;
      </script>
    </template>
