          position: absolute;
          inset: 0;

          color: #f7efe0;

          background: linear-gradient(180deg, #fff3cf 0%, #e3b25a 45%, #9a6a1c 100%);

          background-clip: text;
          color: transparent;

      <div id="root" data-composition-id="side" data-width="1920" data-height="1080">

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#side-fade", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "none" }, 0);
