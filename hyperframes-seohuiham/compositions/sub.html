<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #sub-box {
          position: absolute;
          left: 0;
          top: 0;
          width: 1920px;
          height: 1080px;
        }
        #sub-video {
          width: 100%;
          height: 100%;
          filter: saturate(0.9) brightness(1.05);
        }
        #sub-haze {
          position: absolute;
          inset: 0;
          background: radial-gradient(ellipse at 50% 55%, rgba(4, 24, 46, 0) 40%, rgba(4, 24, 46, 0.55) 100%);
        }
      </style>
      <div id="root" data-composition-id="sub" data-width="1920" data-height="1080">
        <div id="sub-box">
          <video id="sub-video" src="assets/3d/sub.webm" data-start="0" data-duration="16" muted playsinline></video>
        </div>
        <div id="sub-haze"></div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#sub-box", { opacity: 0, x: 220 }, { opacity: 1, x: 0, duration: 2.4, ease: "power2.out" }, 0);
        tl.to("#sub-box", { x: -60, duration: 13.6, ease: "none" }, 2.4);
        tl.to("#sub-box", { opacity: 0, duration: 1.0, ease: "none" }, 15.0);
        window.__timelines["sub"] = tl;
      </script>
    </template>
  </body>
</html>
