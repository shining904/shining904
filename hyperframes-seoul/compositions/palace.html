<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #palace-fade {
          position: absolute;
          inset: 0;
        }
        #palace-photo {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        #palace-shade {
          position: absolute;
          inset: 0;
          background: linear-gradient(0deg, rgba(0, 0, 0, 0.72) 0%, rgba(0, 0, 0, 0) 45%);
        }
        #palace-caption {
          position: absolute;
          left: 120px;
          bottom: 110px;
        }
        #palace-kicker {
          font-size: 30px;
          font-weight: 500;
          letter-spacing: 0.3em;
          color: #fcd34d;
        }
        #palace-title {
          margin-top: 12px;
          font-size: 96px;
          font-weight: 800;
          letter-spacing: -0.03em;
          color: #ffffff;
        }
      </style>
      <div id="root" data-composition-id="palace" data-width="1920" data-height="1080">
        <div id="palace-fade">
          <img id="palace-photo" src="assets/palace.jpg" alt="경복궁" />
          <div id="palace-shade"></div>
          <div id="palace-caption">
            <div id="palace-kicker">SCENE 01</div>
            <div id="palace-title">경복궁</div>
          </div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#palace-photo", { scale: 1 }, { scale: 1.12, duration: 3.8, ease: "none" }, 0);
        tl.fromTo("#palace-kicker", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.5);
        tl.fromTo("#palace-title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.65);
        window.__timelines["palace"] = tl;
      </script>
    </template>
  </body>
</html>
