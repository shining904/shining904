<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>이천 도자기 손그림</title>
    <script src="gsap.min.js"></script>
    <script src="p5.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #f1e9d8;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f1e9d8;
      }
    </style>
  </head>
  <body>
    <!-- Hand-drawn test: every frame is redrawn by p5.js from the GSAP clock (seeded noise,
         so seeking is deterministic). Music: Magnific Google Lyria, original track. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <div id="ink" data-composition-id="ink" data-composition-src="compositions/ink.html"
        data-start="0" data-duration="15" data-track-index="0" data-width="1080" data-height="1920"></div>
      <audio id="soundtrack" src="assets/audio/music.mp3" data-start="0" data-duration="15" data-track-index="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
