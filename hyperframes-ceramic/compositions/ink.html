<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Nanum Brush Script";
          src: url("fonts/nanum-brush-script-latin-400-normal.woff2") format("woff2");
          unicode-range: U+0000-00FF;
        }
        @font-face {
          font-family: "Nanum Brush Script";
          src: url("fonts/nanum-brush-script-korean-400-normal.woff2") format("woff2");
          unicode-range: U+1100-11FF, U+3130-318F, U+AC00-D7AF;
        }
        @font-face {
          font-family: "Nanum Myeongjo";
          font-weight: 800;
          src: url("fonts/nanum-myeongjo-latin-800-normal.woff2") format("woff2");
          unicode-range: U+0000-00FF;
        }
        @font-face {
          font-family: "Nanum Myeongjo";
          font-weight: 800;
          src: url("fonts/nanum-myeongjo-korean-800-normal.woff2") format("woff2");
          unicode-range: U+1100-11FF, U+3130-318F, U+AC00-D7AF;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #f1e9d8;
        }
        #ink-cam {
          position: absolute;
          inset: 0;
          transform-origin: 50% 62%;
        }
        #ink-cam canvas {
          display: block;
        }
        .ink-line {
          position: absolute;
          left: 110px;
          font-family: "Nanum Brush Script", cursive;
          font-size: 150px;
          line-height: 1;
          color: #1d1a17;
          clip-path: inset(0 100% 0 0);
        }
        #ink-title {
          position: absolute;
          left: 0;
          right: 0;
          top: 1560px;
          text-align: center;
          font-family: "Nanum Brush Script", cursive;
          font-size: 180px;
          line-height: 1;
          color: #1d1a17;
          clip-path: inset(0 100% 0 0);
        }
        #ink-seal {
          position: absolute;
          left: 935px;
          top: 1575px;
          width: 110px;
          height: 110px;
          border-radius: 10px;
          background: #b8322a;
          color: #f6efe0;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: "Nanum Myeongjo", serif;
          font-weight: 800;
          font-size: 42px;
          writing-mode: vertical-rl;
          letter-spacing: 4px;
          opacity: 0;
        }
        #ink-sub {
          position: absolute;
          left: 0;
          right: 0;
          top: 1780px;
          text-align: center;
          font-family: "Nanum Myeongjo", serif;
          font-weight: 800;
          font-size: 40px;
          letter-spacing: 6px;
          color: #5b4a3a;
          opacity: 0;
        }
      </style>
      <div id="root" data-composition-id="ink" data-width="1080" data-height="1920">
        <div id="ink-cam"></div>
        <div id="ink-l1" class="ink-line" style="top: 230px">흙을 빚고,</div>
        <div id="ink-l2" class="ink-line" style="top: 400px; left: 260px">불로 굽고,</div>
        <div id="ink-l3" class="ink-line" style="top: 570px; left: 410px">천 년을 잇다</div>
        <div id="ink-title">이천 도자기</div>
        <div id="ink-seal">이천</div>
        <div id="ink-sub">ICHEON CERAMICS</div>
      </div>
      <script>
        (function () {
          const W = 1080, H = 1920, CX = 540;
          // Maebyeong (plum vase) profile: [y, radius]
          const PROFILE = [[880, 52], [900, 48], [925, 62], [960, 150], [1010, 215], [1070, 232], [1150, 222], [1250, 192], [1350, 160], [1440, 132], [1490, 124], [1505, 128]];
          function radiusAt(y) {
            for (let i = 0; i < PROFILE.length - 1; i++) {
              const [y0, r0] = PROFILE[i], [y1, r1] = PROFILE[i + 1];
              if (y >= y0 && y <= y1) {
                return r0 + ((r1 - r0) * (y - y0)) / (y1 - y0);
              }
            }
            return 0;
          }
          const TOP = PROFILE[0][0], BOT = PROFILE[PROFILE.length - 1][0];
          // Sample the profile, then smooth it (moving average) so the shoulder curves softly
          let side = [];
          for (let y = TOP; y <= BOT; y += 3) side.push([y, radiusAt(y)]);
          for (let pass = 0; pass < 4; pass++) {
            side = side.map(([y, r], i) => {
              let sum = 0, n = 0;
              for (let k = -6; k <= 6; k++) {
                const j = Math.min(side.length - 1, Math.max(0, i + k));
                sum += side[j][1];
                n++;
              }
              return [y, sum / n];
            });
          }
          // One continuous outline: lip -> down the left -> foot -> up the right -> lip
          const OUTLINE = [];
          side.forEach(([y, r]) => OUTLINE.push([CX - r, y]));
          const FOOT = side[side.length - 1][1];
          for (let x = CX - FOOT; x <= CX + FOOT; x += 6) OUTLINE.push([x, BOT]);
          for (let i = side.length - 1; i >= 0; i--) OUTLINE.push([CX + side[i][1], side[i][0]]);
          function circlePts(cx, cy, r, start) {
            const pts = [];
            for (let i = 0; i <= 90; i++) {
              const a = start + (i / 90) * Math.PI * 2;
              pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r * 0.92]);
            }
            return pts;
          }
          function cranePts(cx, cy, s) {
            return [[cx - 46 * s, cy - 6 * s], [cx - 22 * s, cy - 26 * s], [cx - 4 * s, cy - 4 * s], [cx + 16 * s, cy - 30 * s], [cx + 44 * s, cy - 10 * s], [cx + 6 * s, cy + 6 * s], [cx + 30 * s, cy + 22 * s]];
          }
          function spiralPts(cx, cy, r) {
            const pts = [];
            for (let i = 0; i <= 50; i++) {
              const a = (i / 50) * Math.PI * 3.2, rr = r * (1 - i / 60);
              pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * 0.7]);
            }
            return pts;
          }
          function densify(pts, step) {
            const out = [];
            for (let i = 0; i < pts.length - 1; i++) {
              const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
              const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / step));
              for (let k = 0; k < n; k++) out.push([x0 + ((x1 - x0) * k) / n, y0 + ((y1 - y0) * k) / n]);
            }
            out.push(pts[pts.length - 1]);
            return out;
          }
          const PATTERN = [
            circlePts(540, 1130, 88, -Math.PI / 2), densify(cranePts(540, 1132, 1.15), 4),
            circlePts(420, 1300, 60, -Math.PI / 2), densify(cranePts(420, 1302, 0.75), 4),
            circlePts(660, 1300, 60, -Math.PI / 2), densify(cranePts(660, 1302, 0.75), 4),
            spiralPts(450, 1030, 26), spiralPts(640, 1040, 24), spiralPts(540, 1420, 22), spiralPts(370, 1180, 18), spiralPts(710, 1185, 18),
          ];
          // Kiln flames on both sides of the vase: [x, height, width]
          const FLAMES = [[150, 420, 70], [240, 330, 60], [330, 210, 46], [930, 420, 70], [840, 330, 60], [750, 210, 46]];
          const clamp = (v) => Math.max(0, Math.min(1, v));
          const prog = (t, a, b) => clamp((t - a) / (b - a));

          let P = null, paper = null;
          new p5(function (p) {
            p.setup = function () {
              p.createCanvas(W, H).parent(document.getElementById("ink-cam"));
              p.pixelDensity(1);
              p.noLoop();
              paper = p.createGraphics(W, H);
              paper.pixelDensity(1);
              paper.randomSeed(11);
              paper.noiseSeed(11);
              paper.background(241, 233, 216);
              paper.noStroke();
              for (let i = 0; i < 9000; i++) {
                const x = paper.random(W), y = paper.random(H), g = paper.random(-14, 10);
                paper.fill(200 + g, 186 + g, 160 + g, paper.random(18, 50));
                paper.circle(x, y, paper.random(1, 3.2));
              }
              paper.stroke(170, 150, 120, 22);
              for (let i = 0; i < 260; i++) {
                const x = paper.random(W), y = paper.random(H), a = paper.random(Math.PI);
                paper.line(x, y, x + Math.cos(a) * 40, y + Math.sin(a) * 40);
              }
              P = p;
            };
            p.draw = function () {};
          });

          // Bristle brush along a path, drawn up to `amt` (0..1) of its length.
          function brush(pts, amt, w, col, alpha, seed) {
            const n = Math.floor((pts.length - 1) * amt);
            if (n < 1) return;
            for (let b = 0; b < 5; b++) {
              for (let i = 0; i < n; i++) {
                const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
                const dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy) || 1;
                const nx = -dy / len, ny = dx / len;
                const press = 0.45 + 0.55 * Math.sin(Math.PI * Math.min(1, (i + 2) / (pts.length * 0.12 + 2))) * (0.75 + 0.25 * P.noise(i * 0.03, seed));
                const off = (P.noise(i * 0.015, b * 7 + seed) - 0.5) * w * 0.8;
                P.stroke(col[0], col[1], col[2], alpha * (0.55 + 0.45 * P.noise(i * 0.08, b + seed * 3)));
                P.strokeWeight(Math.max(0.6, w * 0.32 * press));
                P.line(x0 + nx * off, y0 + ny * off, x1 + nx * off, y1 + ny * off);
              }
            }
            if (amt < 1) {
              const [hx, hy] = pts[n];
              P.noStroke();
              P.fill(col[0], col[1], col[2], alpha * 0.8);
              P.circle(hx, hy, w * 0.9);
            }
          }
          function vasePath(ctx, jitter, seed) {
            ctx.beginPath();
            OUTLINE.forEach(([x, y], i) => {
              const j = jitter ? (P.noise(i * 0.05, seed) - 0.5) * jitter : 0;
              const xx = x + (x < CX ? -j : j);
              if (i === 0) ctx.moveTo(xx, y); else ctx.lineTo(xx, y);
            });
            ctx.closePath();
          }
          function render(t) {
            if (!P) return;
            P.randomSeed(5);
            P.noiseSeed(5);
            const ctx = P.drawingContext;
            P.image(paper, 0, 0);
            // Kiln flames on both sides, growing then fading
            const fl = prog(t, 9.6, 11.6), fade = 1 - prog(t, 13.2, 14.6);
            if (fl > 0 && fade > 0) {
              FLAMES.forEach(([fx, fh, fw], k) => {
                const grow = clamp(fl * 1.5 - (k % 3) * 0.18);
                if (grow <= 0) return;
                const layers = [[214, 72, 30, 1], [240, 140, 40, 0.7], [250, 205, 90, 0.4]];
                layers.forEach(([r, g, b, sc], L) => {
                  for (let pass = 0; pass < 3; pass++) {
                    ctx.beginPath();
                    const hh = fh * grow * sc * (0.92 + 0.08 * Math.sin(t * 9 + k + pass));
                    for (let i = 0; i <= 30; i++) {
                      const a = i / 30, half = fw * sc * Math.pow(Math.sin(Math.PI * Math.min(1, a * 1.15)), 0.8) * (1 - a * 0.35);
                      const sway = Math.sin(a * 3 + t * 6 + k * 1.7 + pass) * fw * 0.35 * a;
                      const x = fx + sway - half, y = 1530 - a * hh;
                      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                    }
                    for (let i = 30; i >= 0; i--) {
                      const a = i / 30, half = fw * sc * Math.pow(Math.sin(Math.PI * Math.min(1, a * 1.15)), 0.8) * (1 - a * 0.35);
                      const sway = Math.sin(a * 3 + t * 6 + k * 1.7 + pass) * fw * 0.35 * a;
                      ctx.lineTo(fx + sway + half, 1530 - a * hh);
                    }
                    ctx.closePath();
                    ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${0.16 * fade})`;
                    ctx.fill();
                  }
                });
              });
            }
            // Potter's wheel
            const wh = prog(t, 0, 1.0);
            if (wh > 0) {
              const pts = [];
              for (let i = 0; i <= 120; i++) {
                const a = Math.PI + (i / 120) * Math.PI * 2;
                pts.push([CX + Math.cos(a) * 320, 1530 + Math.sin(a) * 46]);
              }
              brush(pts, wh, 14, [29, 26, 23], 160, 2);
              const spin = 1 - prog(t, 3.0, 4.0);
              if (spin > 0) {
                for (let k = 0; k < 3; k++) {
                  const a0 = t * 5 + k * 2.1, arc = [];
                  for (let i = 0; i <= 14; i++) {
                    const a = a0 + i * 0.05;
                    arc.push([CX + Math.cos(a) * 360, 1530 + Math.sin(a) * 62]);
                  }
                  brush(arc, 1, 6, [29, 26, 23], 110 * spin, 9 + k);
                }
              }
            }
            // Celadon wash rising from the foot
            const wash = prog(t, 3.0, 4.7);
            if (wash > 0) {
              const level = BOT - (BOT - TOP + 20) * (1 - Math.pow(1 - wash, 2));
              ctx.save();
              ctx.beginPath();
              ctx.rect(0, level, W, H);
              ctx.clip();
              for (let L = 0; L < 7; L++) {
                vasePath(ctx, 14, 20 + L);
                ctx.fillStyle = "rgba(118, 168, 148, 0.11)";
                ctx.fill();
              }
              vasePath(ctx, 0, 0);
              ctx.clip();
              P.noStroke();
              for (let i = 0; i < 26; i++) {
                const bx = CX + P.random(-220, 220), by = P.random(TOP, BOT), br = P.random(40, 140);
                P.fill(84, 132, 116, 14);
                P.circle(bx, by, br);
              }
              ctx.restore();
            }
            // Ink outline of the vase
            brush(OUTLINE, prog(t, 0.3, 3.0), 18, [29, 26, 23], 210, 1);
            // Glaze highlight
            const hl = prog(t, 4.6, 5.1);
            if (hl > 0) {
              const pts = [];
              for (let y = 1010; y <= 1220; y += 4) pts.push([CX - radiusAt(y) * 0.6, y]);
              brush(pts, hl, 12, [250, 247, 238], 170, 30);
            }
            // White slip pattern: medallions, cranes, clouds
            const pt = prog(t, 5.6, 8.8);
            if (pt > 0) {
              PATTERN.forEach((pts, k) => {
                const a = clamp(pt * PATTERN.length * 0.55 - k * 0.45);
                brush(pts, a, 8, [246, 241, 228], 230, 60 + k);
              });
            }
          }
          const state = { t: 0 };
          const tl = gsap.timeline({ paused: true });
          tl.to(state, { t: 15, duration: 15, ease: "none", onUpdate: () => render(state.t) }, 0);
          tl.fromTo("#ink-cam", { scale: 1 }, { scale: 1.06, duration: 10, ease: "sine.inOut" }, 0);
          tl.to("#ink-cam", { scale: 0.94, y: -60, duration: 1.4, ease: "power2.inOut" }, 10.4);
          tl.fromTo("#ink-l1", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.9, ease: "power1.inOut" }, 5.0);
          tl.fromTo("#ink-l2", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.9, ease: "power1.inOut" }, 7.0);
          tl.fromTo("#ink-l3", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 1.0, ease: "power1.inOut" }, 9.0);
          tl.to(".ink-line", { opacity: 0, duration: 0.5 }, 11.2);
          tl.fromTo("#ink-title", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 1.1, ease: "power1.inOut" }, 11.6);
          tl.fromTo("#ink-seal", { opacity: 0, scale: 2.2, rotation: -12 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.22, ease: "power4.out" }, 12.8);
          tl.fromTo("#ink-sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6 }, 13.1);
          window.__timelines["ink"] = tl;
          render(0);
        })();
      </script>
    </template>
  </body>
</html>
