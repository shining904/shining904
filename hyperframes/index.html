<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>설치 완료 인트로</title>
    <script src="gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Noto Sans KR";
        font-weight: 500;
        src: url("fonts/noto-sans-kr-latin-500-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+2190-21FF;
      }
      @font-face {
        font-family: "Noto Sans KR";
        font-weight: 500;
        src: url("fonts/noto-sans-kr-korean-500-normal.woff2") format("woff2");
        unicode-range: U+1100-11FF, U+3130-318F, U+AC00-D7AF;
      }
      @font-face {
        font-family: "Noto Sans KR";
        font-weight: 800;
        src: url("fonts/noto-sans-kr-latin-800-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+2190-21FF;
      }
      @font-face {
        font-family: "Noto Sans KR";
        font-weight: 800;
        src: url("fonts/noto-sans-kr-korean-800-normal.woff2") format("woff2");
        unicode-range: U+1100-11FF, U+3130-318F, U+AC00-D7AF;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0d12;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: #f4f4f5;
        font-family: "Noto Sans KR", sans-serif;
        background:
          radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.35), transparent 55%),
          radial-gradient(circle at 80% 75%, rgba(236, 72, 153, 0.28), transparent 55%),
          #0b0d12;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <div id="intro" data-composition-id="intro" data-composition-src="compositions/intro.html"
        data-start="0" data-duration="2.8" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="tools" data-composition-id="tools" data-composition-src="compositions/tools.html"
        data-start="2.8" data-duration="2.8" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html"
        data-start="5.6" data-duration="2.4" data-track-index="0" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
