<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        @font-face {
          font-family: "Song Myung";
          font-weight: 400;
          src: url("fonts/song-myung-latin-400-normal.woff2") format("woff2");
          unicode-range: U+0000-00FF, U+2190-21FF;
        }
        @font-face {
          font-family: "Song Myung";
          font-weight: 400;
          src: url("fonts/song-myung-korean-400-normal.woff2") format("woff2");
          unicode-range: U+1100-11FF, U+3130-318F, U+AC00-D7AF;
        }
        #cta-fade {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          padding-top: 250px;
        }
        #cta-medallion {
          width: 340px;
          height: 340px;
          border-radius: 50%;
          overflow: hidden;
          border: 10px solid #b8912f;
          background: #e8dccb;
          display: flex;
          justify-content: center;
          align-items: flex-end;
        }
        #cta-face {
          display: block;
          width: 330px;
          height: auto;
        }
        .cta-line {
          font-family: "Song Myung", serif;
          font-weight: 400;
          font-size: 80px;
          line-height: 1.3;
          color: #2b1d1a;
          text-align: center;
        }
        #cta-line1 {
          margin-top: 36px;
        }
        #cta-card {
          margin-top: 40px;
          width: 900px;
          padding: 44px 48px;
          border-radius: 32px;
          background: #b8524a;
          color: #ffffff;
          text-align: center;
        }
        #cta-name {
          font-family: "Song Myung", serif;
          font-weight: 400;
          font-size: 64px;
        }
        #cta-date {
          margin-top: 20px;
          font-size: 48px;
          font-weight: 800;
        }
        #cta-place {
          margin-top: 12px;
          font-size: 40px;
          font-weight: 500;
        }
        #cta-row {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 320px;
          display: flex;
          justify-content: center;
          align-items: flex-end;
          gap: 36px;
        }
        .cta-figure {
          display: block;
          width: auto;
        }
        #cta-child {
          height: 300px;
        }
        #cta-youth {
          height: 360px;
        }
        #cta-elder {
          height: 375px;
        }
      </style>
      <div id="root" data-composition-id="cta" data-width="1080" data-height="1920">
        <div id="cta-fade">
          <div id="cta-medallion"><img id="cta-face" src="assets/elder-smile.png" alt="웃는 장년기 서희" /></div>
          <div id="cta-line1" class="cta-line">가족과 함께</div>
          <div id="cta-line2" class="cta-line">놀러 오세요!</div>
          <div id="cta-card">
            <div id="cta-name">2026 장위공 서희 외교문화제</div>
            <div id="cta-date">10.3(토) ~ 10.4(일) · 10:00~17:00</div>
            <div id="cta-place">이천 서희테마파크 일원</div>
          </div>
          <div id="cta-row">
            <img id="cta-child" class="cta-figure" src="assets/child.png" alt="유년기 서희" />
            <img id="cta-youth" class="cta-figure" src="assets/youth.png" alt="청년기 서희" />
            <img id="cta-elder" class="cta-figure" src="assets/elder.png" alt="장년기 서희" />
          </div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#cta-fade", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, 0);
        tl.fromTo("#cta-medallion", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.8)" }, 0.1);
        tl.fromTo(".cta-line", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.15 }, 0.45);
        tl.fromTo("#cta-card", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.9);
        tl.fromTo(".cta-figure", { opacity: 0, y: 100 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.12 }, 1.2);
        window.__timelines["cta"] = tl;
      </script>
    </template>
  </body>
</html>
