<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>이천시 환경개선부담금 연납</title>
    <script src="gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Noto Sans KR";
        font-weight: 500;
        src: url("fonts/noto-sans-kr-latin-500-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+2190-21FF;
      }
      @font-face {
        font-family: "Noto Sans KR";
        font-weight: 500;
        src: url("fonts/noto-sans-kr-korean-500-normal.woff2") format("woff2");
        unicode-range: U+1100-11FF, U+3130-318F, U+AC00-D7AF;
      }
      @font-face {
        font-family: "Noto Sans KR";
        font-weight: 800;
        src: url("fonts/noto-sans-kr-latin-800-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+2190-21FF;
      }
      @font-face {
        font-family: "Noto Sans KR";
        font-weight: 800;
        src: url("fonts/noto-sans-kr-korean-800-normal.woff2") format("woff2");
        unicode-range: U+1100-11FF, U+3130-318F, U+AC00-D7AF;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f4f7f2;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f4f7f2;
        font-family: "Noto Sans KR", sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- Scene "discount" is a Remotion render: remotion/src/Icheon/DiscountScene.tsx -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1920"
      data-height="1080"
    >
      <div id="title" data-composition-id="title" data-composition-src="compositions/title.html"
        data-start="0" data-duration="4.3" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="discount" data-composition-id="discount" data-composition-src="compositions/discount.html"
        data-start="3.8" data-duration="5.5" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="howto" data-composition-id="howto" data-composition-src="compositions/howto.html"
        data-start="8.8" data-duration="5.5" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div id="notes" data-composition-id="notes" data-composition-src="compositions/notes.html"
        data-start="13.8" data-duration="4.0" data-track-index="3" data-width="1920" data-height="1080"></div>
      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html"
        data-start="17.3" data-duration="2.7" data-track-index="4" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
