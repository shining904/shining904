<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #discount-fade {
          position: absolute;
          inset: 0;
          background: #f4f7f2;
          color: #10231a;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
        }
        #discount-video {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
        }
      </style>
      <div id="root" data-composition-id="discount" data-width="1920" data-height="1080">
        <div id="discount-fade">
          <video id="discount-video" src="assets/discount.mp4" data-start="0" data-duration="5.5" muted playsinline></video>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#discount-fade", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "none" }, 0);
        window.__timelines["discount"] = tl;
      </script>
    </template>
  </body>
</html>
