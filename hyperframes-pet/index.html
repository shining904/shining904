<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>개우 도전 1일차</title>
    <script src="gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
    </style>
  </head>
  <body>
    <!-- 2026 이천펫축제 릴스. Clips: Magnific Seedance 2.5; music Lyria; narration ElevenLabs (Jiwoo). -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <div id="d1" data-composition-id="d1" data-composition-src="compositions/d1.html"
        data-start="0.0" data-duration="7.4" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div id="d2" data-composition-id="d2" data-composition-src="compositions/d2.html"
        data-start="7.4" data-duration="7.2" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="d3" data-composition-id="d3" data-composition-src="compositions/d3.html"
        data-start="14.6" data-duration="7.4" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html"
        data-start="22.0" data-duration="8.0" data-track-index="1" data-width="1080" data-height="1920"></div>
      <audio id="soundtrack" src="assets/audio/mix.mp3" data-start="0" data-duration="30" data-track-index="2"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
