<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>흙과 불이 빚은 시간</title>
    <script src="gsap.min.js"></script>
    <script src="p5.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #120c09;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #120c09;
      }
    </style>
  </head>
  <body>
    <!-- motion-lab demo. 3D jar: Meshy 7.1 (via Magnific) rendered in Blender Cycles with alpha. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <div id="kiln" data-composition-id="kiln" data-composition-src="compositions/kiln.html"
        data-start="0" data-duration="15" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div id="ink" data-composition-id="ink" data-composition-src="compositions/ink.html"
        data-start="0" data-duration="15" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="jar" data-composition-id="jar" data-composition-src="compositions/jar.html"
        data-start="2.4" data-duration="12.6" data-track-index="2" data-width="1080" data-height="1920"></div>
      <div id="type" data-composition-id="type" data-composition-src="compositions/type.html"
        data-start="0" data-duration="15" data-track-index="3" data-width="1080" data-height="1920"></div>
      <audio id="soundtrack" src="assets/audio/music.mp3" data-start="0" data-duration="15" data-track-index="4"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
