<!doctype html>
<html lang="ko">
  <head>

  </head>
  <body>
    <template>
      <style>
        #root {

        }

          font-size: 76px;
          line-height: 1.3;
          color: #2b1d1a;
        }
        #answer-qline1 {
          margin-top: 28px;
        }
        #answer-opts {

          left: 140px;
          top: 640px;
          width: 800px;
          display: flex;

          gap: 24px;

          display: flex;

          background: rgba(255, 255, 255, 0.94);

          border-radius: 50%;

          font-weight: 800;

          align-items: center;
          justify-content: center;
        }
        .answer-label {

          font-weight: 400;

        }

          left: 110px;
          bottom: 330px;
          width: 320px;
          height: 320px;

          display: flex;
          justify-content: center;
          align-items: flex-end;
        }
        #answer-face {
          display: block;

          height: auto;

          color: #ffffff;

          font-weight: 800;
        }
        #answer-explain {
          position: absolute;
          left: 480px;
          right: 90px;
          top: 1250px;
          font-size: 40px;
          white-space: nowrap;
          font-weight: 500;
          line-height: 1.45;
          color: #2b1d1a;
        }
        #answer-explain b {
          font-weight: 800;
          color: #b8524a;
        }

      <div id="root" data-composition-id="answer" data-width="1080" data-height="1920">
        <div id="answer-fade">
          <div id="answer-q">

              <div class="answer-num">2</div>
              <div class="answer-label">탐라</div>

            <div id="answer-opt3" class="answer-opt">

              <div class="answer-label">요동</div>
            </div>
          </div>
          <div id="answer-medallion"><img id="answer-face" src="assets/elder-smile.png" alt="웃는 장년기 서희" /></div>

          <div id="answer-explain">
            <div>싸우지 않고 담판만으로</div>

            <div>얻어냈어요 (993년)</div>
          </div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#answer-fade", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, 0);
        tl.fromTo("#answer-opt2", { opacity: 1 }, { opacity: 0.35, duration: 0.3 }, 0.2);
        tl.fromTo("#answer-opt3", { opacity: 1 }, { opacity: 0.35, duration: 0.3 }, 0.2);
        tl.fromTo("#answer-opt1", { scale: 1 }, { scale: 1.06, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }, 0.3);
        tl.fromTo("#answer-stamp", { opacity: 0, scale: 2 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 0.4);
        tl.fromTo("#answer-bubble", { scale: 0.6 }, { scale: 1, duration: 0.4, ease: "back.out(2)", transformOrigin: "0% 100%" }, 0.5);
        tl.fromTo("#answer-explain", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.0);
        window.__timelines["answer"] = tl;
      </script>

</html>
